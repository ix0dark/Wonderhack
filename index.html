/* WonderHack design system — v1 (prototype)
   Logical properties throughout (inline-start/end) so dir="rtl" works for Arabic later. */
:root{
  --bg:#080B14; --bg-2:#0A0F1C; --sb:#0B1020; --card:#121A2B; --elev:#19233A; --elev-2:#202C47; --field:#0C1222;
  --line:#22304B; --line-2:#2E3D5E; --line-3:#3A4B70;
  --tx:#F3F4F6; --tx-2:#A7B0C0; --tx-3:#8390A8;
  --blue:#3B82F6; --blue-btn:#2563EB; --blue-tx:#7AB0FF; --purple:#8B5CF6; --purple-tx:#B49CFF;
  --grad:linear-gradient(120deg,#3B82F6 0%,#8B5CF6 100%);
  --grad-soft:linear-gradient(120deg,rgba(59,130,246,.16),rgba(139,92,246,.12));
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.7);
  --sh-lg:0 30px 70px -24px rgba(0,0,0,.85),0 0 0 1px rgba(139,92,246,.22);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue-tx);text-underline-offset:3px}
a:hover{color:#A9CBFF}
button{font-family:inherit}
::selection{background:rgba(139,92,246,.45);color:#fff}
:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:100;padding:10px 14px;border-radius:10px;background:#2563EB;color:#fff;text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ---------- type ---------- */
.display{font:700 clamp(40px,6vw,74px)/1.02 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.h1{font:700 32px/1.12 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.h3{font:600 17px/1.3 var(--f-body);margin:0}
.h4{font:600 15px/1.35 var(--f-body);margin:0}
.lead{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--tx-2);margin:0;text-wrap:pretty}
.sub{color:var(--tx-2);margin:6px 0 0;font-size:15px;line-height:1.55;text-wrap:pretty}
.p{color:var(--tx-2);margin:0;font-size:15px;line-height:1.65;text-wrap:pretty}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--purple-tx)}
.muted{color:var(--tx-2)} .faint{color:var(--tx-3)} .mono{font-family:var(--f-mono)} .small{font-size:13px}
.grad-text{background:linear-gradient(100deg,#6AA8FF 0%,#B49CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kbd{font:500 11.5px var(--f-mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--tx-2);background:var(--field)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* ---------- icons (CSS masks; colour = currentColor) ---------- */
.i{display:inline-block;width:18px;height:18px;flex:0 0 auto;background-color:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.i-sm{width:15px;height:15px} .i-lg{width:22px;height:22px} .i-xl{width:28px;height:28px}
[dir="rtl"] .i-flip{transform:scaleX(-1)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font:600 14.5px/1 var(--f-body);border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;color:var(--tx);background:transparent;transition:transform .18s var(--ease),background-color .18s,border-color .18s,box-shadow .25s,color .18s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:#2563EB;color:#fff;box-shadow:0 8px 22px -10px rgba(59,130,246,.85)}
.btn-primary:hover{background:#1F5BE3;color:#fff;transform:translateY(-1px);box-shadow:0 12px 30px -10px rgba(59,130,246,.95),0 0 0 1px rgba(147,197,253,.35) inset}
.btn-accent{background:linear-gradient(120deg,#2563EB,#7C3AED);color:#fff;box-shadow:0 10px 26px -12px rgba(124,58,237,.9)}
.btn-accent:hover{color:#fff;transform:translateY(-1px);box-shadow:0 14px 34px -12px rgba(124,58,237,1),0 0 0 1px rgba(196,181,253,.35) inset}
.btn-outline{border-color:var(--line-2);background:rgba(255,255,255,.02);color:var(--tx)}
.btn-outline:hover{border-color:#5B8FF0;background:rgba(59,130,246,.08);color:#fff}
.btn-ghost{color:var(--tx-2)}
.btn-ghost:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.btn-danger{background:#B91C1C;color:#fff}
.btn-danger:hover{background:#A51616;color:#fff}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-lg{min-height:52px;padding:0 24px;font-size:16px;border-radius:14px}
.btn-icon{width:40px;min-height:40px;height:40px;padding:0;border-radius:11px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:wh-spin .7s linear infinite;flex:0 0 auto}
.link-btn{background:none;border:0;padding:0;color:var(--blue-tx);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- badges / tags / severity ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:600 12px/1 var(--f-body);border:1px solid;white-space:nowrap}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-blue{color:#9CC4FF;background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.38)}
.b-purple{color:#CBBEFF;background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.42)}
.b-amber{color:#FCD34D;background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.38)}
.b-green{color:#6EE7B7;background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.38)}
.b-teal{color:#5EEAD4;background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.36)}
.b-cyan{color:#7DE6F7;background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.34)}
.b-gray{color:#C9D0DB;background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.32)}
.b-slate{color:#A7B0C0;background:rgba(100,116,139,.10);border-color:rgba(100,116,139,.34)}
.b-orange{color:#FDBA74;background:rgba(251,146,60,.10);border-color:rgba(251,146,60,.38)}
.b-red{color:#FCA5A5;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.42)}
.b-solid{color:#fff;background:var(--grad);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font:500 12px var(--f-mono);background:var(--field);border:1px solid var(--line);color:#C3CAD6;white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f-body);white-space:nowrap}
.sev-bars{display:inline-flex;gap:2px;align-items:flex-end}
.sev-bars i{display:block;width:4px;border-radius:2px;background:#2E3D5E}
.sev-bars i:nth-child(1){height:6px}.sev-bars i:nth-child(2){height:9px}.sev-bars i:nth-child(3){height:12px}.sev-bars i:nth-child(4){height:15px}
.sev-low{color:#B6C2D6}.sev-low i:nth-child(-n+1){background:#B6C2D6}
.sev-medium{color:#FCD34D}.sev-medium i:nth-child(-n+2){background:#FBBF24}
.sev-high{color:#FDBA74}.sev-high i:nth-child(-n+3){background:#FB923C}
.sev-critical{color:#FCA5A5}.sev-critical i{background:#F87171}
.sev-none{color:var(--tx-3)}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-pad{padding:24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.card-body{padding:20px 22px}
.surface{background:var(--elev);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.lift{transition:transform .25s var(--ease),border-color .25s,box-shadow .3s}
.lift:hover{transform:translateY(-3px);border-color:rgba(96,165,250,.45);box-shadow:0 22px 50px -26px rgba(0,0,0,.9),0 0 0 1px rgba(139,92,246,.18)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:10px 18px;margin:0;font-size:14px}
.kv dt{color:var(--tx-3)} .kv dd{margin:0;color:var(--tx)}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff;flex:0 0 auto;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.logo-sm{width:32px;height:32px;border-radius:9px;font-size:12px}
.logo-lg{width:64px;height:64px;border-radius:18px;font-size:21px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 13px var(--f-display);color:#fff;flex:0 0 auto}
.avatar-sm{width:30px;height:30px;font-size:11.5px}
.stat{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.stat-v{font:700 30px/1 var(--f-display)}
.stat-l{font-size:13.5px;color:var(--tx-2)}

/* ---------- alerts ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid;font-size:14px;line-height:1.55}
.alert .i{margin-top:2px}
.a-info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.35);color:#D6E6FF}
.a-info .i{color:#7AB0FF}
.a-warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.38);color:#FDEFC4}
.a-warn .i{color:#FCD34D}
.a-err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.42);color:#FFD9D9}
.a-err .i{color:#FCA5A5}
.a-ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.36);color:#D3F7E8}
.a-ok .i{color:#6EE7B7}
.a-purple{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.38);color:#E6DEFF}

.step.is-done .step-dot{background:#2563EB;border-color:#2563EB;color:#fff}
.step.is-current .step-dot{border-color:#A78BFA;color:#fff;background:#1B1440;box-shadow:0 0 0 6px rgba(139,92,246,.18);animation:wh-pulse 2.4s ease-in-out infinite}
.step-label{font:600 13px/1.3 var(--f-body);color:var(--tx-3);padding-inline-end:10px}
.step.is-done .step-label{color:var(--tx-2)}
.step.is-current .step-label{color:#fff}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding-inline-start:30px;padding-bottom:22px}
.tl li::before{content:"";position:absolute;inset-inline-start:7px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl-dot{position:absolute;inset-inline-start:0;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid #7AB0FF}
.tl-dot.p{border-color:#B49CFF}.tl-dot.a{border-color:#FCD34D}.tl-dot.g{border-color:#6EE7B7}
.tl-title{font-weight:600;font-size:14px;color:var(--tx)}
.tl-meta{font:400 12.5px var(--f-mono);color:var(--tx-3);margin-top:3px}
.tl-body{font-size:14px;color:var(--tx-2);margin-top:6px;line-height:1.55}

/* ---------- conversation ---------- */
.thread{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;animation:wh-rise .35s var(--ease) both}
.msg-body{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:14px 16px}
[dir="rtl"] .msg-body{border-radius:16px 6px 16px 16px}
.msg-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.msg-text{font-size:14.5px;line-height:1.62;color:#DCE1EA;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.msg-internal .msg-body{background:repeating-linear-gradient(135deg,rgba(251,191,36,.055) 0 10px,rgba(251,191,36,.015) 10px 20px),var(--card);border:1px dashed rgba(251,191,36,.6)}
.msg-request .msg-body{border-color:rgba(251,191,36,.45);background:linear-gradient(180deg,rgba(251,191,36,.05),transparent 60%),var(--card)}
.msg-system .msg-body{background:transparent;border-style:dashed}
.composer{border:1px solid var(--line-2);border-radius:16px;background:var(--field);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.composer.is-internal{border-color:rgba(251,191,36,.6);border-style:dashed}
.composer.is-internal:focus-within{box-shadow:0 0 0 3px rgba(251,191,36,.18)}
.composer .textarea{border:0;background:transparent;border-radius:0;min-height:96px;box-shadow:none}
.composer-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.code{font:13px/1.65 var(--f-mono);background:#060912;border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;color:#C9D4E5;margin:0}

/* ---------- dialogs / toasts ---------- */
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(3,5,10,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;animation:wh-fade .2s}
.modal{width:min(540px,100%);background:var(--elev);border:1px solid var(--line-2);border-radius:22px;box-shadow:var(--sh-lg);padding:28px;animation:wh-modal .32s var(--ease);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:24px;inset-inline-end:24px;z-index:90;display:flex;gap:12px;align-items:flex-start;width:min(400px,calc(100vw - 32px));padding:14px 16px;border-radius:14px;background:var(--elev-2);border:1px solid var(--line-2);box-shadow:var(--sh-lg);animation:wh-toast .34s var(--ease);font-size:14px;line-height:1.5}
.toast-ok{border-color:rgba(52,211,153,.55)} .toast-ok>.i{color:#6EE7B7}
.toast-err{border-color:rgba(248,113,113,.6)} .toast-err>.i{color:#FCA5A5}

/* ---------- uploads ---------- */
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line-2);border-radius:16px;padding:28px 20px;text-align:center;background:rgba(12,18,34,.6);transition:border-color .2s,background-color .2s;cursor:pointer;color:var(--tx-2);font-size:14px;width:100%}
.drop:hover{border-color:#60A5FA;background:rgba(59,130,246,.06);color:var(--tx)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);animation:wh-rise .3s var(--ease) both}
.file-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--elev-2);color:var(--tx-2);flex:0 0 auto}
.file.is-err{border-color:rgba(248,113,113,.5)}
.bar{height:6px;border-radius:3px;background:#0C1222;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .5s var(--ease)}

/* ---------- states ---------- */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 24px;border:1px dashed var(--line-2);border-radius:22px;background:rgba(18,26,43,.45)}
.state-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--grad-soft);color:#C9D9FF;border:1px solid rgba(122,176,255,.28)}
.state-ic.err{background:rgba(248,113,113,.1);color:#FCA5A5;border-color:rgba(248,113,113,.35)}
.sk{background:linear-gradient(90deg,#131C30 0%,#1C2843 45%,#131C30 90%);background-size:220% 100%;animation:wh-shimmer 1.5s ease-in-out infinite;border-radius:8px}

/* ---------- keyframes ---------- */
@keyframes wh-spin{to{transform:rotate(360deg)}}
@keyframes wh-shimmer{0%{background-position:100% 0}100%{background-position:-120% 0}}
@keyframes wh-fade{from{opacity:0}to{opacity:1}}
@keyframes wh-pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes wh-drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes wh-modal{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes wh-slide{from{transform:translateX(-100%)}to{transform:none}}
@keyframes wh-slide-rtl{from{transform:translateX(100%)}to{transform:none}}
@keyframes wh-page{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes wh-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wh-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wh-pulse{0%,100%{box-shadow:0 0 0 6px rgba(139,92,246,.18)}50%{box-shadow:0 0 0 10px rgba(139,92,246,.06)}}
@keyframes wh-toast{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes wh-grow{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes wh-shake{0%,100%{transform:none}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
}
/* review demo additions */
.demo-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:7px 16px;font:500 12.5px/1.4 var(--f-body);color:#C9D0DB;background:#0B1020;border-bottom:1px solid var(--line);text-align:center}
.demo-bar .i{color:#B49CFF}
.demo-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx-3)}
.demo-note .i{color:#B49CFF}
@media (max-width:600px){.tb .demo-flag{display:none}}

/* standalone export */
#app{min-height:100vh}
.demo-bar{position:relative;z-index:50}
.demo-reset{margin-inline-start:8px;min-height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:#DCE1EA;font:600 12px var(--f-body);cursor:pointer}
.demo-reset:hover{border-color:#5B8FF0;color:#fff;background:rgba(59,130,246,.1)}
button.drop{font:inherit}
.tbl-wrap{position:relative}
.oc[data-up] .oc-pop{top:auto;bottom:-12px;transform-origin:50% 100%}
.oc-pop{overscroll-behavior:contain}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)!important}}

</style>
</head>

"flex: 1 1 260px\"><span class=\"i i-search\"><\/span><label class=\"sr-only\" for=\"cr-q\">Search<\/label><input id=\"cr-q\" class=\"input\" type=\"search\" placeholder=\"Search ID or title\" value=\"{{q}}\" onInput=\"{{setQ}}\"><\/div>\n        <label class=\"sr-only\" for=\"cr-s\">Status<\/label><select id=\"cr-s\" class=\"select\" style=\"width: auto; flex: 0 1 200px\" value=\"{{st}}\" onChange=\"{{setSt}}\"><option value=\"\">All statuses<\/option><sc-for list=\"{{statuses}}\" as=\"x\" hint-placeholder-count=\"5\"><option value=\"{{x}}\">{{x}}<\/option><\/sc-for><\/select>\n        <label class=\"sr-only\" for=\"cr-v\">Severity<\/label><select id=\"cr-v\" class=\"select\" style=\"width: auto; flex: 0 1 170px\" value=\"{{sev}}\" onChange=\"{{setSev}}\"><option value=\"\">All severities<\/option><option>Low<\/option><option>Medium<\/option><option>High<\/option><option>Critical<\/option><\/select>\n        <label class=\"sr-only\" for=\"cr-p\">Program<\/label><select id=\"cr-p\" class=\"select\" style=\"width: auto; flex: 0 1 230px\" value=\"{{prog}}\" onChange=\"{{setProg}}\"><option value=\"\">All programs<\/option><option>Storefront Bug Bounty<\/option><option>Loyalty App Disclosure<\/option><option>Holiday Campaign Microsite<\/option><\/select>\n        <span class=\"small muted\" aria-live=\"polite\">{{count}}<\/span>\n      <\/section>\n      <sc-if value=\"{{has}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th scope=\"col\">Report<\/th><th scope=\"col\">Program<\/th><th scope=\"col\">Severity<\/th><th scope=\"col\">Status<\/th><th scope=\"col\">Submitted<\/th><th scope=\"col\">Last update<\/th><\/tr><\/thead><tbody>\n          <sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\"><tr><td><span class=\"mono faint\" style=\"font-size: 12px\">{{r.id}}<\/span><br><a class=\"row-link\" href=\"ReportDetailCompany.dc.html\">{{r.title}}<\/a><\/td><td class=\"muted\">{{r.prog}}<\/td><td><span class=\"sev {{r.sevCls}}\"><span class=\"sev-bars\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span>{{r.sev}}<\/span><\/td><td><span class=\"badge dot {{r.stCls}}\">{{r.st}}<\/span><\/td><td class=\"mono muted\" style=\"font-size: 13px\">{{r.sub}}<\/td><td class=\"mono muted\" style=\"font-size: 13px\">{{r.upd}}<\/td><\/tr><\/sc-for>\n        <\/tbody><\/table><\/div>\n      <\/sc-if>\n      <sc-if value=\"{{none}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"state\"><span class=\"state-ic\"><span class=\"i i-inbox i-xl\"><\/span><\/span><h2 class=\"h2\">No reports match these filters<\/h2><button type=\"button\" class=\"btn btn-outline\" onClick=\"{{clear}}\">Clear filters<\/button><\/div><\/sc-if>\n    <\/main>\n  <\/div>\n<\/div>\n", "Info": "\n\n<div style=\"min-height: 100vh; background: #080B14; color: #F3F4F6\">\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<header class=\"ph\">\n  <div class=\"ph-in\">\n    <a class=\"brand\" href=\"Main.dc.html\" aria-label=\"WonderHack home\"><span class=\"brand-mark\">/$<\/span><span>WonderHack<\/span><\/a>\n    <nav class=\"ph-nav\" aria-label=\"Primary\"><a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a><a class=\"ph-link\" href=\"Pentesting.dc.html\">Pentesting<\/a><a class=\"ph-link is-active\" href=\"Info.dc.html\" aria-current=\"page\">How It Works<\/a><a class=\"ph-link\" href=\"Main.dc.html#faq\">FAQ<\/a><\/nav>\n    <div class=\"ph-actions\"><a class=\"btn btn-primary\" href=\"Auth.dc.html\">Explore Demo<\/a><\/div>\n    <button class=\"btn btn-outline btn-icon ph-burger\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"{{menuExpanded}}\" onClick=\"{{toggleMenu}}\"><span class=\"i {{menuIcon}}\"><\/span><\/button>\n  <\/div>\n  <sc-if value=\"{{menuOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <nav class=\"ph-mobile\" aria-label=\"Mobile\"><a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a><a class=\"ph-link\" href=\"Pentesting.dc.html\">Pentesting<\/a><a class=\"ph-link\" href=\"Info.dc.html\">How It Works<\/a><div style=\"display: flex; gap: 8px; padding-top: 8px\"><a class=\"btn btn-primary\" style=\"flex: 1\" href=\"Auth.dc.html\">Explore Demo<\/a><\/div><\/nav>\n  <\/sc-if>\n<\/header>\n\n<main id=\"main\" class=\"mk-wrap\" style=\"padding-top: 48px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 26px; max-width: 1040px\">\n  <div class=\"tabs\" role=\"tablist\" aria-label=\"Page\">\n    <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"7\"><button type=\"button\" role=\"tab\" class=\"tab {{t.cls}}\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\">{{t.label}}<\/button><\/sc-for>\n  <\/div>\n\n  <!-- HOW IT WORKS -->\n  <sc-if value=\"{{p.how}}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"display: flex; flex-direction: column; gap: 28px; animation: wh-page .4s both\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px\"><span class=\"eyebrow\">How it works<\/span><h1 class=\"display\" style=\"font-size: clamp(34px, 4.6vw, 54px)\">Two tracks, one set of rules.<\/h1><p class=\"lead\">WonderHack runs Bug Bounty programs and professional pentests on one platform. Each user gets a workspace for their role, and the server checks every action.<\/p><\/div>\n      <div class=\"g-auto\">\n        <article class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 14px\"><h2 class=\"h2\">Bug Bounty<\/h2>\n          <ol class=\"tl\"><li><span class=\"tl-dot\"><\/span><div class=\"tl-title\">The company publishes a program<\/div><div class=\"tl-body\">Scope, exclusions, prohibited tests, disclosure policy, rewards or No Bounty. Public programs need WonderHack approval.<\/div><\/li><li><span class=\"tl-dot p\"><\/span><div class=\"tl-title\">Researchers participate<\/div><div class=\"tl-body\">Open programs accept reports directly. Some company requests need an approved application first.<\/div><\/li><li><span class=\"tl-dot a\"><\/span><div class=\"tl-title\">Triage validates<\/div><div class=\"tl-body\">Severity and status changes are recorded with a reason. Triage may ask the researcher for more information.<\/div><\/li><li><span class=\"tl-dot g\"><\/span><div class=\"tl-title\">The company resolves<\/div><div class=\"tl-body\">It sees only its own programs’ reports and acts within its permissions.<\/div><\/li><\/ol>\n        <\/article>\n        <article class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 14px\"><h2 class=\"h2\">Pentesting<\/h2>\n          <ol class=\"tl\"><li><span class=\"tl-dot\"><\/span><div class=\"tl-title\">Request<\/div><div class=\"tl-body\">Choose a service and describe the need. No credentials.<\/div><\/li><li><span class=\"tl-dot p\"><\/span><div class=\"tl-title\">Scoping and quotation<\/div><div class=\"tl-body\">WonderHack agrees on the scope and uploads a quotation you can accept.<\/div><\/li><li><span class=\"tl-dot a\"><\/span><div class=\"tl-title\">Authorization<\/div><div class=\"tl-body\">Written authorization, scope agreement and Rules of Engagement before testing.<\/div><\/li><li><span class=\"tl-dot g\"><\/span><div class=\"tl-title\">Testing and delivery<\/div><div class=\"tl-body\">Track the stages, messages and files; download the final report.<\/div><\/li><\/ol>\n        <\/article>\n      <\/div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px\"><a class=\"btn btn-primary\" href=\"PublicOpportunities.dc.html\">Explore Opportunities<\/a><a class=\"btn btn-outline\" href=\"Pentesting.dc.html\">Request Security Testing<\/a><\/div>\n    <\/section>\n  <\/sc-if>\n\n  <!-- ABOUT -->\n  <sc-if value=\"{{p.about}}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display: flex; flex-direction: column; gap: 22px; animation: wh-page .4s both\">\n      <h1 class=\"display\" style=\"font-size: clamp(34px, 4.6vw, 54px)\">About WonderHack<\/h1>\n      <p class=\"lead\">WonderHack is a cybersecurity platform with two services: connecting companies with security researchers through Bug Bounty programs, and delivering professional penetration testing.<\/p>\n      <p class=\"p\">More about the team and company will be published here.<\/p>\n    <\/section>\n  <\/sc-if>\n\n  <!-- CONTACT -->\n  <sc-if value=\"{{p.contact}}\" hint-placeholder-val=\"{{ false }}\">\n    <section class=\"split\" style=\"animation: wh-page .4s both\">\n      <div class=\"card\" style=\"padding: 28px; border-radius: 22px; display: flex; flex-direction: column; gap: 16px\">\n        <h1 class=\"h1\">Contact<\/h1>\n        <sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div>Demo only — no message was sent.<\/div><\/div><\/sc-if>\n        <sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{ true }}\">\n          <form style=\"display: flex; flex-direction: column; gap: 14px\" onSubmit=\"{{sendContact}}\" noValidate=\"{{ true }}\">\n            <div class=\"field\"><label class=\"label\" for=\"c-name\">Name<\/label><input id=\"c-name\" class=\"input {{cn}}\" value=\"{{cName}}\" onInput=\"{{setCName}}\"><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"c-email\">Email<\/label><input id=\"c-email\" class=\"input {{ce}}\" type=\"email\" value=\"{{cEmail}}\" onInput=\"{{setCEmail}}\"><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"c-topic\">Topic<\/label><select id=\"c-topic\" class=\"select\" value=\"{{cTopic}}\" onChange=\"{{setCTopic}}\"><option>General question<\/option><option>Bug Bounty for my company<\/option><option>Pentesting<\/option><option>Researcher account<\/option><\/select><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"c-msg\">Message<\/label><textarea id=\"c-msg\" class=\"textarea {{cm}}\" value=\"{{cMsg}}\" onInput=\"{{setCMsg}}\"><\/textarea><\/div>\n            <sc-if value=\"{{cErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Fill in your name, a valid email and a message.<\/span><\/sc-if>\n            <span class=\"demo-note\"><span class=\"i i-info i-sm\"><\/span>Demo form — nothing is sent.<\/span>\n            <button type=\"submit\" class=\"btn btn-primary\" disabled=\"{{cBusy}}\"><sc-if value=\"{{cBusy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Send message<\/button>\n          <\/form>\n        <\/sc-if>\n      <\/div>\n      <aside class=\"split-side\">\n        <div class=\"card\" style=\"padding: 18px; font-size: 14px; color: #A7B0C0\">Contact details will be listed here.<\/div>\n        <div class=\"alert a-purple\"><span class=\"i i-shield\"><\/span><div>Found a vulnerability in WonderHack itself? Follow the <button type=\"button\" class=\"link-btn\" onClick=\"{{toDisclosure}}\">Responsible Disclosure Policy<\/button>.<\/div><\/div>\n      <\/aside>\n    <\/section>\n  <\/sc-if>\n\n  <!-- FAQ -->\n  <sc-if value=\"{{p.faq}}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display: flex; flex-direction: column; gap: 10px; animation: wh-page .4s both\">\n      <h1 class=\"h1\" style=\"margin-bottom: 12px\">Frequently asked questions<\/h1>\n      <details class=\"faq\"><summary>Does applying or accepting an opportunity let me test?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">No. You test only listed assets, under the program rules, and only after any required approval and written authorization.<\/div><\/details>\n      <details class=\"faq\"><summary>Can other researchers see my reports?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">No. Reports are visible only to you and to people authorized for that program. A duplicate decision never shows details of the other report.<\/div><\/details>\n      <details class=\"faq\"><summary>Who decides the final severity?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">You suggest a severity, and you can add a CVSS vector. WonderHack triage sets the final severity.<\/div><\/details>\n      <details class=\"faq\"><summary>Are rewards paid on the platform?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">Not in this release. Rewards are administrative records on accepted reports.<\/div><\/details>\n      <details class=\"faq\"><summary>How are files protected?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">Files are kept in private storage and downloaded through short-lived links issued after a permission check.<\/div><\/details>\n      <details class=\"faq\"><summary>Is Arabic supported?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">English is the first language. The interface is built to support Arabic and right-to-left layouts later.<\/div><\/details>\n    <\/section>\n  <\/sc-if>\n\n  <!-- LEGAL -->\n  <sc-if value=\"{{p.legal}}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display: flex; flex-direction: column; gap: 18px; animation: wh-page .4s both\">\n      <span class=\"eyebrow\">Legal<\/span>\n      <h1 class=\"display\" style=\"font-size: clamp(32px, 4.4vw, 50px)\">{{legalTitle}}<\/h1>\n      <p class=\"p\">The full text will be published before launch. It will cover:<\/p>\n      <ol style=\"margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; color: #C9D0DB; line-height: 1.6\">\n        <sc-for list=\"{{legalSections}}\" as=\"x\" hint-placeholder-count=\"5\"><li>{{x}}<\/li><\/sc-for>\n      <\/ol>\n      \n    <\/section>\n  <\/sc-if>\n<\/main>\n<footer class=\"ft\"><div class=\"mk-wrap\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\"><a class=\"brand\" href=\"Main.dc.html\"><span class=\"brand-mark\">/$<\/span><span>WonderHack<\/span><\/a><span class=\"small faint\">© 2026 WonderHack<\/span><\/div><\/footer>\n<\/div>\n", "Main": "\n\n<div style=\"min-height: 100vh; background: #080B14; color: #F3F4F6\">\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n\n<header class=\"ph\">\n  <div class=\"ph-in\">\n    <a class=\"brand\" href=\"Main.dc.html\" aria-label=\"WonderHack home\"><span class=\"brand-mark\">/$<\/span><span>WonderHack<\/span><\/a>\n    <nav class=\"ph-nav\" aria-label=\"Primary\">\n      <a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a>\n      <a class=\"ph-link\" href=\"Pentesting.dc.html\">Pentesting<\/a>\n      <a class=\"ph-link\" href=\"Info.dc.html\">How It Works<\/a>\n      <a class=\"ph-link\" href=\"#faq\">FAQ<\/a>\n    <\/nav>\n    <div class=\"ph-actions\">\n      <a class=\"btn btn-primary\" href=\"Auth.dc.html\"><span class=\"i i-arrow-right i-flip\"><\/span>Explore Demo<\/a>\n    <\/div>\n    <button class=\"btn btn-outline btn-icon ph-burger\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"{{menuExpanded}}\" onClick=\"{{toggleMenu}}\"><span class=\"i {{menuIcon}}\"><\/span><\/button>\n  <\/div>\n  <sc-if value=\"{{menuOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <nav class=\"ph-mobile\" aria-label=\"Mobile\">\n      <a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a>\n      <a class=\"ph-link\" href=\"Pentesting.dc.html\">Pentesting<\/a>\n      <a class=\"ph-link\" href=\"Info.dc.html\">How It Works<\/a>\n      <a class=\"ph-link\" href=\"#faq\">FAQ<\/a>\n      <div style=\"display: flex; gap: 8px; padding-top: 8px\">\n        <a class=\"btn btn-primary\" style=\"flex: 1\" href=\"Auth.dc.html\">Explore Demo<\/a>\n      <\/div>\n    <\/nav>\n  <\/sc-if>\n<\/header>\n\n<main id=\"main\">\n  <!-- HERO -->\n  <section class=\"hero\" style=\"padding: 88px 0 96px\">\n    <div class=\"gridbg\"><\/div>\n    <div class=\"mk-wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 56px; align-items: center\">\n      <div class=\"reveal\" style=\"display: flex; flex-direction: column; gap: 26px\">\n        <span class=\"pill\"><b>MVP<\/b>Authorized security testing for companies<\/span>\n        <h1 class=\"display\">Companies open the door. <span class=\"grad-text\">Researchers test within the rules.<\/span><\/h1>\n        <p class=\"lead\">WonderHack connects companies that want their websites, APIs and apps tested with the security researchers who find what needs fixing — under written scope, published rules and decisions you can trace.<\/p>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <a class=\"btn btn-primary btn-lg\" href=\"PublicOpportunities.dc.html\">Explore Opportunities<span class=\"i i-arrow-right i-flip\"><\/span><\/a>\n          <a class=\"btn btn-outline btn-lg\" href=\"Pentesting.dc.html\">Request Security Testing<\/a>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 6px\">\n          <span class=\"eyebrow\">Explore Demo · no sign-up needed<\/span>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px\">\n            <a class=\"card lift\" href=\"Opportunities.dc.html\" style=\"display: flex; gap: 14px; align-items: center; padding: 16px; text-decoration: none; color: #F3F4F6; border-radius: 16px\">\n              <span class=\"choice-ic\"><span class=\"i i-bug\"><\/span><\/span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\"><span class=\"h4\">Researcher demo<\/span><span class=\"small muted\">Starts on Opportunities<\/span><\/span>\n              <span class=\"i i-chev-right i-flip\" style=\"margin-inline-start: auto; color: #8390A8\"><\/span>\n            <\/a>\n            <a class=\"card lift\" href=\"CompanyOverview.dc.html\" style=\"display: flex; gap: 14px; align-items: center; padding: 16px; text-decoration: none; color: #F3F4F6; border-radius: 16px\">\n              <span class=\"choice-ic\"><span class=\"i i-building\"><\/span><\/span>\n              <span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\"><span class=\"h4\">Company demo<\/span><span class=\"small muted\">Programs, reports, pentests<\/span><\/span>\n              <span class=\"i i-chev-right i-flip\" style=\"margin-inline-start: auto; color: #8390A8\"><\/span>\n            <\/a>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- product visual (illustrative, demo data) -->\n      <div aria-hidden=\"true\" style=\"position: relative; min-height: 470px\">\n        <div class=\"float\" style=\"position: absolute; inset-inline-end: 0; top: 0; width: min(380px, 92%); padding: 20px; border-radius: 24px; background: #121A2B; border: 1px solid #22304B; box-shadow: 0 30px 70px -30px rgba(0,0,0,.9); display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; align-items: center; gap: 12px\"><span class=\"logo\" style=\"background: linear-gradient(135deg,#2563EB,#7C3AED)\">QR<\/span><div style=\"display: flex; flex-direction: column\"><span class=\"oc-org\">Qamar Retail<\/span><span class=\"oc-title\" style=\"font-size: 16px\">Storefront Bug Bounty<\/span><\/div><\/div>\n          <div class=\"oc-tags\"><span class=\"badge b-blue\">Bug Bounty<\/span><span class=\"tag\">Web<\/span><span class=\"tag\">API<\/span><\/div>\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #22304B\"><span class=\"oc-reward\">$150 – $4,000<\/span><span class=\"badge dot b-green\">Open<\/span><\/div>\n        <\/div>\n        <div class=\"float\" style=\"animation-delay: -2.5s; position: absolute; inset-inline-start: 0; top: 150px; width: min(360px, 88%); padding: 20px; border-radius: 24px; background: linear-gradient(#19233A,#19233A) padding-box, linear-gradient(135deg,rgba(122,176,255,.7),rgba(180,156,255,.7)) border-box; border: 1px solid transparent; box-shadow: 0 30px 80px -24px rgba(0,0,0,.9), 0 0 50px -14px rgba(99,102,241,.55); display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; align-items: center; gap: 12px\"><span class=\"logo\" style=\"background: linear-gradient(135deg,#0E7490,#2563EB)\">DP<\/span><div style=\"display: flex; flex-direction: column\"><span class=\"oc-org\">Dhow Pay<\/span><span class=\"oc-title\" style=\"font-size: 16px\">Payments API Security Request<\/span><\/div><\/div>\n          <p class=\"oc-sum\" style=\"display: block\">Applications reviewed by the company. Testing starts only after written authorization.<\/p>\n          <div style=\"display: flex; gap: 8px\"><span class=\"badge b-purple\">Participation request<\/span><span class=\"badge dot b-blue\">Applications open<\/span><\/div>\n          <span class=\"btn btn-primary btn-sm\" style=\"align-self: flex-start\">Apply to participate<\/span>\n        <\/div>\n        <div class=\"float\" style=\"animation-delay: -5s; position: absolute; inset-inline-end: 24px; bottom: 0; width: min(300px, 80%); padding: 16px 18px; border-radius: 18px; background: #121A2B; border: 1px solid #22304B; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center\"><span class=\"mono small faint\">WH-1042<\/span><span class=\"badge dot b-amber\">Needs Information<\/span><\/div>\n          <span class=\"h4\">Stored XSS in order notes<\/span>\n          <span class=\"sev sev-high\"><span class=\"sev-bars\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span>High<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"mk-wrap\" style=\"margin-top: 22px\"><span class=\"small faint\">Illustration uses demo data, not real programs.<\/span><\/div>\n  <\/section>\n\n  <!-- TWO TRACKS -->\n  <section class=\"section\" aria-labelledby=\"tracks\">\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 40px\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px\">\n        <span class=\"eyebrow\">Two ways to test<\/span>\n        <h2 id=\"tracks\" class=\"h1\">Continuous research, or a scoped engagement.<\/h2>\n        <p class=\"lead\">Both run on one platform with one sign-in. Each has its own workspace, permissions and records.<\/p>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 22px\">\n        <article class=\"card lift\" style=\"padding: 32px; display: flex; flex-direction: column; gap: 18px; border-radius: 24px\">\n          <div style=\"display: flex; align-items: center; gap: 14px\"><span class=\"choice-ic\" style=\"width: 48px; height: 48px\"><span class=\"i i-bug i-lg\"><\/span><\/span><div><span class=\"eyebrow\">Track 1<\/span><h3 class=\"h2\" style=\"margin-top: 6px\">Bug Bounty<\/h3><\/div><\/div>\n          <p class=\"p\">A company publishes a program with its scope, exclusions, prohibited tests and disclosure policy. Researchers test only what is listed and submit reports. WonderHack triage validates each report, and the company decides and resolves.<\/p>\n          <ul class=\"oc-list\" style=\"font-size: 14.5px; gap: 10px\">\n            <li><span class=\"i i-check\" style=\"color: #7AB0FF\"><\/span>Public or private programs — private ones are visible only to invited researchers<\/li>\n            <li><span class=\"i i-check\" style=\"color: #7AB0FF\"><\/span>Reward range or “No Bounty”, shown up front<\/li>\n            <li><span class=\"i i-check\" style=\"color: #7AB0FF\"><\/span>Every status change records who, when and why<\/li>\n          <\/ul>\n          <a class=\"btn btn-primary\" style=\"align-self: flex-start; margin-top: auto\" href=\"PublicOpportunities.dc.html\">Explore Opportunities<\/a>\n        <\/article>\n        <article class=\"card lift\" style=\"padding: 32px; display: flex; flex-direction: column; gap: 18px; border-radius: 24px\">\n          <div style=\"display: flex; align-items: center; gap: 14px\"><span class=\"choice-ic\" style=\"width: 48px; height: 48px\"><span class=\"i i-briefcase i-lg\"><\/span><\/span><div><span class=\"eyebrow\">Track 2<\/span><h3 class=\"h2\" style=\"margin-top: 6px\">Professional Pentesting<\/h3><\/div><\/div>\n          <p class=\"p\">Request a Web, API, Mobile, Cloud, Network or Active Directory test. WonderHack scopes it with you, sends a quotation and runs the project. Testing begins only after written authorization, agreed scope and Rules of Engagement.<\/p>\n          <ul class=\"oc-list\" style=\"font-size: 14.5px; gap: 10px\">\n            <li><span class=\"i i-check\" style=\"color: #B49CFF\"><\/span>Track each stage from request to delivered report<\/li>\n            <li><span class=\"i i-check\" style=\"color: #B49CFF\"><\/span>Review and accept the quotation in your workspace<\/li>\n            <li><span class=\"i i-check\" style=\"color: #B49CFF\"><\/span>Messages and files restricted to your organization<\/li>\n          <\/ul>\n          <a class=\"btn btn-accent\" style=\"align-self: flex-start; margin-top: auto\" href=\"Pentesting.dc.html\">Request Security Testing<\/a>\n        <\/article>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- HOW IT WORKS -->\n  <section class=\"section\" aria-labelledby=\"how\">\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 32px\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 680px\">\n          <span class=\"eyebrow\">How it works<\/span>\n          <h2 id=\"how\" class=\"h1\">From published program to resolved report.<\/h2>\n        <\/div>\n        <div class=\"seg\" role=\"group\" aria-label=\"Show steps for\">\n          <button type=\"button\" class=\"{{companyCls}}\" aria-pressed=\"{{companyPressed}}\" onClick=\"{{showCompany}}\">For companies<\/button>\n          <button type=\"button\" class=\"{{researcherCls}}\" aria-pressed=\"{{researcherPressed}}\" onClick=\"{{showResearcher}}\">For researchers<\/button>\n        <\/div>\n      <\/div>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 16px\">\n        <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"5\">\n          <li class=\"card reveal\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px; animation-delay: {{s.delay}}\">\n            <span class=\"num\">{{s.n}}<\/span>\n            <h3 class=\"h3\">{{s.title}}<\/h3>\n            <p class=\"p\" style=\"font-size: 14px\">{{s.body}}<\/p>\n          <\/li>\n        <\/sc-for>\n      <\/ol>\n      <a class=\"btn btn-outline\" style=\"align-self: flex-start\" href=\"Info.dc.html\">Read the full walkthrough<span class=\"i i-arrow-right i-flip\"><\/span><\/a>\n    <\/div>\n  <\/section>\n\n  <!-- PRINCIPLES -->\n  <section class=\"section\" aria-labelledby=\"rules\">\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 32px\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n        <span class=\"eyebrow\">Rules before testing<\/span>\n        <h2 id=\"rules\" class=\"h1\">Permission is explicit, never implied.<\/h2>\n      <\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px\">\n        <div class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px\"><span class=\"i i-file i-lg\" style=\"color: #7AB0FF\"><\/span><h3 class=\"h3\">Written scope comes first<\/h3><p class=\"p\" style=\"font-size: 14px\">In-scope assets, exclusions and prohibited tests are published before anyone starts. Joining an opportunity never widens that scope.<\/p><\/div>\n        <div class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px\"><span class=\"i i-lock i-lg\" style=\"color: #B49CFF\"><\/span><h3 class=\"h3\">Private stays private<\/h3><p class=\"p\" style=\"font-size: 14px\">Private programs and confidential scope details are shown only to people the company has authorized.<\/p><\/div>\n        <div class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px\"><span class=\"i i-history i-lg\" style=\"color: #7AB0FF\"><\/span><h3 class=\"h3\">Every decision is traceable<\/h3><p class=\"p\" style=\"font-size: 14px\">Report statuses, severity changes and quotation approvals are recorded with who made them, when and why.<\/p><\/div>\n        <div class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px\"><span class=\"i i-shield i-lg\" style=\"color: #B49CFF\"><\/span><h3 class=\"h3\">Publication is reviewed<\/h3><p class=\"p\" style=\"font-size: 14px\">Public programs go live only after WonderHack reviews them.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- FAQ -->\n  <section id=\"faq\" class=\"section\" aria-labelledby=\"faq-h\">\n    <div class=\"mk-wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 40px; align-items: start\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px\">\n        <span class=\"eyebrow\">FAQ<\/span>\n        <h2 id=\"faq-h\" class=\"h1\">Questions companies and researchers ask first.<\/h2>\n        <p class=\"p\">More answers on the <a href=\"Info.dc.html\">How It Works<\/a> page.<\/p>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <details class=\"faq\"><summary>Does accepting an opportunity give me permission to test?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">No. You may test only the assets listed in the program’s written scope, under its rules. Some opportunities also need the company to approve your application, and some need written authorization before testing starts.<\/div><\/details>\n        <details class=\"faq\"><summary>Who can see private programs?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">Only researchers the company has invited. Private programs don’t appear in public listings or search.<\/div><\/details>\n        <details class=\"faq\"><summary>Are bounty rewards paid through WonderHack?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">Not in this release. Proposed and approved rewards are kept as administrative records on the report. No payments are processed on the platform.<\/div><\/details>\n        <details class=\"faq\"><summary>What has to happen before a pentest starts?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">The scope is agreed, the quotation is accepted, and written authorization and Rules of Engagement are in place. Accepting a quotation does not replace any of these.<\/div><\/details>\n        <details class=\"faq\"><summary>Can my company use both Bug Bounty and Pentesting?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">Yes. One organization account can run programs and request pentests, and each has its own section and permissions.<\/div><\/details>\n        <details class=\"faq\"><summary>Should I attach sensitive data to a report?<span class=\"i i-chev-down\"><\/span><\/summary><div class=\"faq-a\">No. Show impact with the minimum evidence you need, and redact personal or customer data.<\/div><\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- CTA -->\n  <section class=\"section\">\n    <div class=\"mk-wrap\">\n      <div style=\"position: relative; overflow: hidden; border-radius: 28px; padding: clamp(28px, 5vw, 56px); background: radial-gradient(500px 260px at 0% 0%, rgba(59,130,246,.28), transparent 70%), radial-gradient(500px 260px at

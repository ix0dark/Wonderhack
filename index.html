for>\n            <\/ul>\n          <\/section>\n\n          <section id=\"prohibited\" class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 14px\">\n            <h2 class=\"h2\">Prohibited tests<\/h2>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px\">\n              <sc-for list=\"{{p.prohibited}}\" as=\"x\" hint-placeholder-count=\"4\"><div style=\"display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(248,113,113,.06); border: 1px solid rgba(248,113,113,.25); font-size: 14px; color: #F3D6D6\"><span class=\"i i-alert i-sm\" style=\"color: #FCA5A5; margin-top: 2px\"><\/span>{{x}}<\/div><\/sc-for>\n            <\/div>\n          <\/section>\n\n          <section id=\"disclosure\" class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h2\">Disclosure rules<\/h2>\n            <p class=\"p\">{{p.disclosure}}<\/p>\n            <p class=\"small faint\" style=\"margin: 0\">Platform-wide terms: <a href=\"Info.dc.html\">Responsible Disclosure Policy<\/a><\/p>\n          <\/section>\n\n          <section id=\"rewards\" class=\"card\" style=\"overflow: hidden\">\n            <div class=\"card-head\"><h2 class=\"h2\">Rewards<\/h2><span class=\"badge b-gray\">Administrative records only<\/span><\/div>\n            <div class=\"card-body\" style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div class=\"g-stats\">\n                <sc-for list=\"{{p.rewardTiers}}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div class=\"stat\"><span class=\"sev {{t.cls}}\"><span class=\"sev-bars\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span>{{t.sev}}<\/span><span class=\"stat-v\" style=\"font-size: 24px; font-family: 'IBM Plex Mono', monospace\">{{t.amount}}<\/span><\/div>\n                <\/sc-for>\n              <\/div>\n              <p class=\"small faint\" style=\"margin: 0\">Rewards are recorded as proposed or approved on accepted reports. No payments are processed on WonderHack in this release.<\/p>\n            <\/div>\n          <\/section>\n        <\/div>\n\n        <!-- participation side panel -->\n        <aside class=\"split-side\" aria-label=\"Participation\">\n          <section id=\"authorization\" class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 16px; border-radius: 22px; background: linear-gradient(#121A2B,#121A2B) padding-box, linear-gradient(135deg,rgba(122,176,255,.55),rgba(180,156,255,.55)) border-box; border: 1px solid transparent\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px\"><h2 class=\"h3\">{{panel.heading}}<\/h2><span class=\"badge dot {{panel.badgeCls}}\">{{panel.badge}}<\/span><\/div>\n            <p class=\"p\" style=\"font-size: 14px\">{{panel.body}}<\/p>\n\n            <sc-if value=\"{{panel.showTimeline}}\" hint-placeholder-val=\"{{ false }}\">\n              <ol class=\"tl\">\n                <sc-for list=\"{{panel.timeline}}\" as=\"t\" hint-placeholder-count=\"2\"><li><span class=\"tl-dot {{t.dot}}\"><\/span><div class=\"tl-title\">{{t.title}}<\/div><div class=\"tl-meta\">{{t.meta}}<\/div><\/li><\/sc-for>\n              <\/ol>\n            <\/sc-if>\n\n            <sc-if value=\"{{panel.showAuth}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: rgba(52,211,153,.06); border: 1px solid rgba(52,211,153,.3)\">\n                <span class=\"h4\" style=\"display: flex; gap: 8px; align-items: center\"><span class=\"i i-shield\" style=\"color: #6EE7B7\"><\/span>Written authorization issued<\/span>\n                <dl class=\"kv\" style=\"font-size: 13px; grid-template-columns: auto 1fr\"><dt>Reference<\/dt><dd class=\"mono\">AUTH-DP-0193<\/dd><dt>Testing window<\/dt><dd>3 – 30 Nov 2026<\/dd><dt>Scope<\/dt><dd>As listed on this page, v3<\/dd><\/dl>\n                <button type=\"button\" class=\"btn btn-outline btn-sm\" onClick=\"{{download}}\" disabled=\"{{dlBusy}}\"><sc-if value=\"{{dlBusy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if><span class=\"i i-download i-sm\"><\/span>Download authorization (PDF)<\/button>\n                \n              <\/div>\n            <\/sc-if>\n\n            <sc-if value=\"{{panel.showError}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"alert a-err\" role=\"alert\"><span class=\"i i-alert\"><\/span><div><strong>Not eligible to apply.<\/strong> The server returned <span class=\"mono\">403 ELIGIBILITY_NOT_MET<\/span>: “Applicants need a verified email and at least one accepted report.” <\/div><\/div>\n            <\/sc-if>\n\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <sc-if value=\"{{panel.canApply}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"btn btn-accent btn-block btn-lg\" onClick=\"{{openApply}}\">Apply to participate<\/button><\/sc-if>\n              <sc-if value=\"{{panel.canSubmit}}\" hint-placeholder-val=\"{{ false }}\"><a class=\"btn btn-primary btn-block btn-lg\" href=\"SubmitReport.dc.html\"><span class=\"i i-file\"><\/span>Submit a report<\/a><\/sc-if>\n              <sc-if value=\"{{panel.canWithdraw}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"btn btn-outline btn-block\" onClick=\"{{openWithdraw}}\">Withdraw application<\/button><\/sc-if>\n              <sc-if value=\"{{panel.closed}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"btn btn-outline btn-block\" disabled=\"{{ true }}\">{{panel.closedLabel}}<\/button><\/sc-if>\n            <\/div>\n            <p class=\"small faint\" style=\"margin: 0; line-height: 1.5\">{{panel.fine}}<\/p>\n          <\/section>\n\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h4\">Program facts<\/h2>\n            <dl class=\"kv\" style=\"font-size: 13.5px\">\n              <dt>Program ID<\/dt><dd class=\"mono\">{{p.pid}}<\/dd>\n              <dt>Published<\/dt><dd>Approved by WonderHack<\/dd>\n              <dt>Last updated<\/dt><dd>{{p.updated}}<\/dd>\n              <dt>Scope version<\/dt><dd>v3<\/dd>\n            <\/dl>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<!-- APPLY DIALOG -->\n<sc-if value=\"{{applyOpen}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"modal-bg\">\n    <form class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"apply-title\" onSubmit=\"{{submitApply}}\" noValidate=\"{{ true }}\">\n      <div class=\"modal-head\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"eyebrow\">Demo<\/span><h2 id=\"apply-title\" class=\"h2\">Apply to participate<\/h2><span class=\"small muted\">{{p.org}} · {{p.title}}<\/span><\/div>\n        <button type=\"button\" class=\"btn btn-ghost btn-icon\" aria-label=\"Close\" onClick=\"{{closeModal}}\" disabled=\"{{busy}}\"><span class=\"i i-x\"><\/span><\/button>\n      <\/div>\n      <div class=\"field\">\n        <label class=\"label\" for=\"ap-why\">Why are you a good fit?<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n        <textarea id=\"ap-why\" class=\"textarea {{whyCls}}\" style=\"min-height: 110px\" placeholder=\"Relevant experience with payment APIs, past findings (without confidential details)…\" aria-invalid=\"{{whyInvalid}}\" aria-describedby=\"ap-why-h\" value=\"{{why}}\" onInput=\"{{setWhy}}\"><\/textarea>\n        <sc-if value=\"{{whyErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\" id=\"ap-why-h\"><span class=\"i i-alert i-sm\"><\/span>Write at least 30 characters ({{whyLen}}/30).<\/span><\/sc-if>\n      <\/div>\n      <div class=\"field\">\n        <label class=\"label\" for=\"ap-exp\">Experience with this asset type<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n        <select id=\"ap-exp\" class=\"select {{expCls}}\" value=\"{{exp}}\" onChange=\"{{setExp}}\" aria-invalid=\"{{expInvalid}}\">\n          <option value=\"\">Select…<\/option><option value=\"lt1\">Less than 1 year<\/option><option value=\"1-3\">1–3 years<\/option><option value=\"3+\">More than 3 years<\/option>\n        <\/select>\n        <sc-if value=\"{{expErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose your experience level.<\/span><\/sc-if>\n      <\/div>\n      <label class=\"check\"><input type=\"checkbox\" checked=\"{{ack1}}\" onChange=\"{{toggleAck1}}\"><span>I have read the scope, participation requirements, prohibited tests and disclosure rules.<\/span><\/label>\n      <label class=\"check\"><input type=\"checkbox\" checked=\"{{ack2}}\" onChange=\"{{toggleAck2}}\"><span>I understand that applying does <strong style=\"color: #F3F4F6\">not<\/strong> authorize testing. I may test only after approval and written authorization, and only within the listed scope.<\/span><\/label>\n      <sc-if value=\"{{ackErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Confirm both statements to continue.<\/span><\/sc-if>\n      <sc-if value=\"{{serverErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-err\" role=\"alert\"><span class=\"i i-alert\"><\/span><div>The application wasn’t saved: <span class=\"mono\">409 APPLICATIONS_CLOSED<\/span>. Nothing was submitted. Refresh the opportunity to see its current status.<\/div><\/div><\/sc-if>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{closeModal}}\" disabled=\"{{busy}}\">Cancel<\/button>\n        <button type=\"submit\" class=\"btn btn-accent\" disabled=\"{{busy}}\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>{{submitLabel}}<\/button>\n      <\/div>\n    <\/form>\n  <\/div>\n<\/sc-if>\n\n<!-- WITHDRAW CONFIRM -->\n<sc-if value=\"{{withdrawOpen}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"modal-bg\">\n    <div class=\"modal\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"wd-title\">\n      <h2 id=\"wd-title\" class=\"h2\">Withdraw your application?<\/h2>\n      <p class=\"p\">{{p.org}} will no longer review it. You can apply again while applications are open.<\/p>\n      <div class=\"modal-actions\">\n        <button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{closeModal}}\" disabled=\"{{busy}}\">Keep application<\/button>\n        <button type=\"button\" class=\"btn btn-danger\" onClick=\"{{confirmWithdraw}}\" disabled=\"{{busy}}\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Withdraw<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"toast {{toastCls}}\" role=\"status\"><span class=\"i {{toastIcon}}\"><\/span><div style=\"flex: 1\">{{toastText}}<\/div><button type=\"button\" class=\"btn btn-ghost btn-icon\" style=\"width: 32px; height: 32px; min-height: 32px\" aria-label=\"Dismiss\" onClick=\"{{dismissToast}}\"><span class=\"i i-x i-sm\"><\/span><\/button><\/div>\n<\/sc-if>\n", "OrgProfile": "\n\n<div class=\"app\">\n  <dc-import name=\"AppSidebar\" role=\"company\" active=\"org\" hint-size=\"268px,100vh\"><\/dc-import>\n  <div class=\"app-main\">\n    <dc-import name=\"AppTopbar\" role=\"company\" active=\"org\" section=\"Organization\" hint-size=\"100%,68px\"><\/dc-import>\n    <main class=\"page\" id=\"main\">\n      <div class=\"page-head\"><div style=\"display: flex; flex-direction: column; gap: 8px\"><h1 class=\"h1\">Organization<\/h1><p class=\"sub\" style=\"margin: 0\">Profile shown on your programs, plus who in your team has access.<\/p><\/div><span class=\"badge b-green\"><span class=\"i i-shield i-sm\"><\/span>Verified by WonderHack<\/span><\/div>\n      <div class=\"split\">\n        <form class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 18px\" onSubmit=\"{{save}}\" noValidate=\"{{ true }}\">\n          <h2 class=\"h3\">Profile<\/h2>\n          <div class=\"g-auto\" style=\"gap: 16px\">\n            <div class=\"field\"><label class=\"label\" for=\"o-name\">Organization name<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"o-name\" class=\"input {{nameCls}}\" value=\"{{name}}\" onInput=\"{{setName}}\"><sc-if value=\"{{nameErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Required.<\/span><\/sc-if><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"o-web\">Website<\/label><input id=\"o-web\" class=\"input {{webCls}}\" type=\"url\" value=\"{{web}}\" onInput=\"{{setWeb}}\"><sc-if value=\"{{webErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Use a full https:// address.<\/span><\/sc-if><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"o-ind\">Industry<\/label><select id=\"o-ind\" class=\"select\" value=\"{{industry}}\" onChange=\"{{setInd}}\"><option>Retail and e-commerce<\/option><option>Financial services<\/option><option>Healthcare<\/option><option>Logistics<\/option><option>Telecommunications<\/option><option>Other<\/option><\/select><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"o-sec\">Security contact email<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"o-sec\" class=\"input {{secCls}}\" type=\"email\" value=\"{{sec}}\" onInput=\"{{setSec}}\"><sc-if value=\"{{secErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Enter a valid email.<\/span><\/sc-if><span class=\"help\">Not shown publicly; used by WonderHack staff.<\/span><\/div>\n          <\/div>\n          <div class=\"field\"><label class=\"label\" for=\"o-desc\">Public description<\/label><textarea id=\"o-desc\" class=\"textarea\" value=\"{{desc}}\" onInput=\"{{setDesc}}\"><\/textarea><\/div>\n          <div style=\"display: flex; justify-content: flex-end; gap: 10px\"><button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{reset}}\" disabled=\"{{pristine}}\">Discard changes<\/button><button type=\"submit\" class=\"btn btn-primary\" disabled=\"{{saveDisabled}}\" title=\"Demo — resets on reload\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Save changes<\/button><\/div>\n        <\/form>\n        <aside class=\"split-side\">\n          <section class=\"card\" style=\"overflow: hidden\">\n            <div class=\"card-head\"><h2 class=\"h3\">Members<\/h2><span class=\"small faint\">3<\/span><\/div>\n            <ul style=\"list-style: none; margin: 0; padding: 8px 12px; display: flex; flex-direction: column\">\n              <li style=\"display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #22304B\"><span class=\"avatar avatar-sm\">LM<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-weight: 600; font-size: 14px\">Layla Al-Mutairi (you)<\/span><span class=\"small faint\">layla@qamar.example<\/span><\/span><span class=\"badge b-purple\">Org admin<\/span><\/li>\n              <li style=\"display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #22304B\"><span class=\"avatar avatar-sm\" style=\"background: linear-gradient(135deg,#0E7490,#2563EB)\">HK<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-weight: 600; font-size: 14px\">Hamad Al-Kandari<\/span><span class=\"small faint\">hamad@qamar.example<\/span><\/span><span class=\"badge b-blue\">Program manager<\/span><\/li>\n              <li style=\"display: flex; gap: 12px; align-items: center; padding: 10px 4px\"><span class=\"avatar avatar-sm\" style=\"background: linear-gradient(135deg,#334155,#4F46E5)\">RS<\/span><span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-weight: 600; font-size: 14px\">Reem Al-Saleh<\/span><span class=\"small faint\">reem@qamar.example<\/span><\/span><span class=\"badge b-gray\">Viewer<\/span><\/li>\n            <\/ul>\n            <div style=\"padding: 14px 20px; border-top: 1px solid #22304B\"><span class=\"help\">Member invitations are coming soon.<\/span><\/div>\n          <\/section>\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 class=\"h3\">Services<\/h2>\n            <div style=\"display: flex; justify-content: space-between; align-items: center\"><span>Bug Bounty<\/span><span class=\"badge dot b-green\">Enabled<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between; align-items: center\"><span>Pentesting<\/span><span class=\"badge dot b-green\">Enabled<\/span><\/div>\n            <span class=\"help\">Each service has separate sections and permissions inside your workspace.<\/span>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast toast-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div style=\"flex: 1\">Demo: changes kept until you reload.<\/div><button type=\"button\" class=\"btn btn-ghost btn-icon\" style=\"width: 32px; height: 32px; min-height: 32px\" aria-label=\"Dismiss\" onClick=\"{{dismiss}}\"><span class=\"i i-x i-sm\"><\/span><\/button><\/div><\/sc-if>\n", "PentestProject": "\n\n<div class=\"app\">\n  <sc-if value=\"{{isCompany}}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"AppSidebar\" role=\"company\" active=\"pentest\" hint-size=\"268px,100vh\"><\/dc-import><\/sc-if>\n  <div class=\"app-main\">\n    <sc-if value=\"{{isCompany}}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"AppTopbar\" role=\"company\" active=\"pentest\" section=\"PT-207\" hint-size=\"100%,68px\"><\/dc-import><\/sc-if>\n    <main class=\"page\" id=\"main\">\n      <nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"{{backHref}}\">{{backLabel}}<\/a><span class=\"i i-chev-right i-sm i-flip\"><\/span><span class=\"mono\">PT-207<\/span><\/nav>\n      <header class=\"page-head\" style=\"align-items: flex-start\">\n        <div style=\"display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span class=\"mono faint\">PT-207<\/span><span class=\"badge dot b-purple\">{{stage}}<\/span><span class=\"badge b-blue\">Web<\/span><span class=\"badge b-gray\">External<\/span><\/div>\n          <h1 class=\"h1\">Web Application Pentest — Qamar Retail<\/h1>\n          <span class=\"small muted\">Responsible: <strong style=\"color: #F3F4F6\">Faisal Rahman<\/strong> (PT lead) · Requested 22 Sep 2026 by Layla Al-Mutairi<\/span>\n        <\/div>\n      <\/header>\n\n      <section class=\"card\" style=\"padding: 22px; border-radius: 20px; margin-bottom: 18px\" aria-label=\"Project stage\">\n        <ol class=\"stepper\">\n          <sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"8\"><li class=\"step {{st.cls}}\" aria-current=\"{{st.current}}\"><span class=\"step-dot\">{{st.n}}<\/span><span class=\"step-label\">{{st.label}}<\/span><\/li><\/sc-for>\n        <\/ol>\n      <\/section>\n\n      <sc-if value=\"{{authBlocking}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"alert a-warn\" role=\"status\" style=\"margin-bottom: 18px\"><span class=\"i i-shield\"><\/span><div><strong>Awaiting written authorization.<\/strong> Testing can’t start until written authorization, the scope agreement and Rules of Engagement are all complete. Accepting the quotation doesn’t replace them.<\/div><\/div>\n      <\/sc-if>\n\n      <div class=\"split\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0\">\n          <!-- QUOTATION -->\n          <section class=\"card\" style=\"overflow: hidden\" aria-labelledby=\"q-h\">\n            <div class=\"card-head\"><h2 id=\"q-h\" class=\"h3\">Quotation<\/h2><span class=\"badge dot {{qCls}}\">{{qStatus}}<\/span><\/div>\n            <div class=\"card-body\" style=\"display: flex; flex-direction: column; gap: 16px\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between\">\n                <div style=\"display: flex; gap: 14px; align-items: center\"><span class=\"file-ic\" style=\"width: 46px; height: 46px\"><span class=\"i i-receipt\"><\/span><\/span><div style=\"display: flex; flex-direction: column; gap: 2px\"><span class=\"h4\">QT-207-1 · Web Application Pentest<\/span><span class=\"small faint\">Uploaded 11 Oct 2026 by Faisal Rahman · valid until 25 Oct 2026<\/span><\/div><\/div>\n                <span class=\"mono\" style=\"font-size: 24px\">$12,500<\/span>\n              <\/div>\n              <dl class=\"kv\" style=\"font-size: 13.5px\"><dt>Scope summary<\/dt><dd>shop.qamar.example, accounts.qamar.example, staff admin portal (3 web apps)<\/dd><dt>Effort<\/dt><dd>12 tester-days, external<\/dd><dt>Proposed window<\/dt><dd>3 – 21 Nov 2026<\/dd><\/dl>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n                <button type=\"button\" class=\"btn btn-outline\" onClick=\"{{dlQuote}}\" disabled=\"{{dlBusy}}\"><sc-if value=\"{{dlBusy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if><span class=\"i i-download i-sm\"><\/span>Quotation PDF<\/button>\n                <sc-if value=\"{{canAccept}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"btn btn-accent\" onClick=\"{{openAccept}}\">Accept quotation<\/button><\/sc-if>\n              <\/div>\n              <sc-if value=\"{{accepted}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-ok\"><span class=\"i i-check-circle\"><\/span><div>Demo: shown as accepted by <strong>Layla Al-Mutairi<\/strong>. This is sample data — in the real product this is recorded with name and time.<\/div><\/div><\/sc-if>\n              <sc-if value=\"{{staffQuoteNote}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"help\">Only the client organization can accept. PT staff can upload a revised quotation while the stage is Scoping or Quotation Sent.<\/span><\/sc-if>\n            <\/div>\n          <\/section>\n\n          <!-- MESSAGES -->\n          <section class=\"card\" style=\"overflow: hidden\" aria-labelledby=\"m-h\">\n            <div class=\"card-head\"><h2 id=\"m-h\" class=\"h3\">Messages<\/h2><span class=\"small faint\">Visible to Qamar Retail and assigned WonderHack staff<\/span><\/div>\n            <div class=\"card-body\" style=\"display: flex; flex-direction: column; gap: 16px\">\n              <div class=\"thread\"><sc-for list=\"{{messages}}\" as=\"m\" hint-placeholder-count=\"3\"><article class=\"msg\"><span class=\"avatar avatar-sm\" aria-hidden=\"true\">{{m.ini}}<\/span><div class=\"msg-body\"><div class=\"msg-head\"><strong>{{m.author}}<\/strong><span class=\"faint\">{{m.role}}<\/span><span class=\"faint mono\" style=\"font-size: 12px\">{{m.time}}<\/span><\/div><p class=\"msg-text\">{{m.text}}<\/p><\/div><\/article><\/sc-for><\/div>\n              <form class=\"composer\" onSubmit=\"{{send}}\"><label class=\"sr-only\" for=\"pm\">Message<\/label><textarea id=\"pm\" class=\"textarea\" placeholder=\"Write a message… Don’t paste credentials here.\" value=\"{{draft}}\" onInput=\"{{setDraft}}\"><\/textarea><div class=\"composer-bar\"><span class=\"small faint\">Demo — messages stay on this page and are not sent.<\/span><button type=\"submit\" class=\"btn btn-primary btn-sm\" disabled=\"{{sendDisabled}}\"><span class=\"i i-send i-sm\"><\/span>Send<\/button><\/div><\/form>\n            <\/div>\n          <\/section>\n\n          <!-- FILES / DELIVERABLES -->\n          <section class=\"card\" style=\"overflow: hidden\" aria-labelledby=\"f-h\">\n            <div class=\"card-head\"><h2 id=\"f-h\" class=\"h3\">Files and deliverables<\/h2><\/div>\n            <div class=\"card-body\" style=\"display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"3\"><div class=\"file\"><span class=\"file-ic\"><span class=\"i {{f.icon}} i-sm\"><\/span><\/span><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column\"><span style=\"font-size: 14px\">{{f.name}}<\/span><span class=\"small faint\">{{f.meta}}<\/span><\/div><sc-if value=\"{{f.demo}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"demo-flag\">Representative · synthetic<\/span><\/sc-if><button type=\"button\" class=\"btn btn-outline btn-sm\" onClick=\"{{f.get}}\"><span class=\"i i-download i-sm\"><\/span>Download<\/button><\/div><\/sc-for>\n              <sc-if value=\"{{reportLocked}}\" hint-placeholder-val=\"{{ true }}\"><div class=\"file\" style=\"border-style: dashed; opacity: .85\"><span class=\"file-ic\"><span class=\"i i-lock i-sm\"><\/span><\/span><div style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-size: 14px\">Final report<\/span><span class=\"small faint\">Available at “Report Delivered”<\/span><\/div><\/div><\/sc-if>\n              <sc-if value=\"{{isStaff}}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-if value=\"{{uploading}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"bar\" role=\"progressbar\" aria-label=\"Uploading deliverable\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{upPct}}\"><span style=\"width: {{upW}}\"><\/span><\/div><\/sc-if>\n              <\/sc-if>\n              <span class=\"help\">Files are private to your organization and assigned staff. Downloads are disabled in this demo.<\/span>\n            <\/div>\n          <\/section>\n        <\/div>\n\n        <aside class=\"split-side\">\n          <sc-if value=\"{{isStaff}}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n              <h2 class=\"h3\">Change stage<\/h2>\n              <sc-if value=\"{{hasNext}}\" hint-placeholder-val=\"{{ true }}\">\n                <p class=\"p\" style=\"font-size: 14px\">Next allowed stage: <strong style=\"color: #F3F4F6\">{{nextStage}}<\/strong><\/p>\n                <sc-if value=\"{{nextBlocked}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-err\"><span class=\"i i-lock\"><\/span><div>Blocked by the server: authorization, scope agreement and RoE must be complete before “{{nextStage}}”.<\/div><\/div><\/sc-if>\n                <div class=\"field\"><label class=\"label\" for=\"st-note\">Note for the timeline<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><textarea id=\"st-note\" class=\"textarea {{noteCls}}\" style=\"min-height: 72px\" value=\"{{note}}\" onInput=\"{{setNote}}\"><\/textarea><sc-if value=\"{{noteErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Add a short note.<\/span><\/sc-if><\/div>\n                <button type=\"button\" class=\"btn btn-primary\" onClick=\"{{advance}}\" disabled=\"{{advanceDisabled}}\"><sc-if value=\"{{advancing}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Move to {{nextStage}}<\/button>\n              <\/sc-if>\n              <sc-if value=\"{{noNext}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"p\">This project is closed.<\/p><\/sc-if>\n            <\/section>\n          <\/sc-if>\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h3\">Authorization<\/h2>\n            <ul class=\"oc-list\" style=\"gap: 10px; font-size: 14px\">\n              <sc-for list=\"{{authItems}}\" as=\"a\" hint-placeholder-count=\"3\"><li style=\"justify-content: space-between\"><span>{{a.label}}<\/span><span class=\"badge {{a.cls}}\">{{a.state}}<\/span><\/li><\/sc-for>\n            <\/ul>\n            <sc-if value=\"{{isStaff}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"btn btn-outline btn-sm\" onClick=\"{{markAuth}}\" disabled=\"{{authDone}}\">Record signed authorization, scope and RoE<\/button><\/sc-if>\n            \n          <\/section>\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h3\">Timeline<\/h2>\n            <ol class=\"tl\"><sc-for list=\"{{timeline}}\" as=\"t\" hint-placeholder-count=\"4\"><li><span class=\"tl-dot {{t.dot}}\"><\/span><div class=\"tl-title\">{{t.title}}<\/div><div class=\"tl-meta\">{{t.meta}}<\/div><\/li><\/sc-for><\/ol>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n\n<sc-if value=\"{{acceptOpen}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"modal-bg\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"acc-t\">\n    <div class=\"modal-head\"><h2 id=\"acc-t\" class=\"h2\">Accept quotation QT-207-1?<\/h2><button type=\"button\" class=\"btn btn-ghost btn-icon\" aria-label=\"Close\" onClick=\"{{closeAccept}}\" disabled=\"{{busy}}\"><span class=\"i i-x\"><\/span><\/button><\/div>\n    <p class=\"p\">In the real product your acceptance is recorded with your name and the time. In this demo it’s kept in memory until you reload.<\/p>\n    <label class=\"check\"><input type=\"checkbox\" checked=\"{{ack}}\" onChange=\"{{toggleAck}}\"><span>I understand that accepting the quotation doesn’t replace written authorization, the scope agreement or Rules of Engagement, and testing won’t start until they’re complete.<\/span><\/label>\n    <sc-if value=\"{{ackErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Confirm to continue.<\/span><\/sc-if>\n    <sc-if value=\"{{acceptErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-err\" role=\"alert\"><span class=\"i i-alert\"><\/span><div>Acceptance not saved (<span class=\"mono\">409 QUOTE_SUPERSEDED<\/span>): a newer quotation exists. Nothing was accepted — reload to review it.<\/div><\/div><\/sc-if>\n    <div class=\"modal-actions\"><button type=\"button\" class=\"btn btn-ghost\" onClick=\"{{closeAccept}}\" disabled=\"{{busy}}\">Cancel<\/button><button type=\"button\" class=\"btn btn-accent\" onClick=\"{{confirmAccept}}\" disabled=\"{{busy}}\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Accept quotation<\/button><\/div>\n  <\/div><\/div>\n<\/sc-if>\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast toast-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div style=\"flex: 1\">{{toastText}}<\/div><button type=\"button\" class=\"btn btn-ghost btn-icon\" style=\"width: 32px; height: 32px; min-height: 32px\" aria-label=\"Dismiss\" onClick=\"{{dismiss}}\"><span class=\"i i-x i-sm\"><\/span><\/button><\/div><\/sc-if>\n", "PentestProjects": "\n\n<div class=\"app\">\n  <dc-import name=\"AppSidebar\" role=\"company\" active=\"pentest\" hint-size=\"268px,100vh\"><\/dc-import>\n  <div class=\"app-main\">\n    <dc-import name=\"AppTopbar\" role=\"company\" active=\"pentest\" section=\"Pentest Projects\" hint-size=\"100%,68px\"><\/dc-import>\n    <main class=\"page\" id=\"main\">\n      <div class=\"page-head\"><div style=\"display: flex; flex-direction: column; gap: 8px\"><h1 class=\"h1\">Pentest Projects<\/h1><p class=\"sub\" style=\"margin: 0\">Managed engagements, kept separate from public researcher opportunities.<\/p><\/div><button type=\"button\" class=\"btn btn-accent\" onClick=\"{{toNew}}\"><span class=\"i i-plus\"><\/span>New pentest request<\/button><\/div>\n      <div class=\"tabs\" role=\"tablist\" style=\"margin-bottom: 20px\"><button type=\"button\" role=\"tab\" class=\"tab {{t1}}\" aria-selected=\"{{a1}}\" onClick=\"{{toList}}\">Requests and projects<\/button><button type=\"button\" role=\"tab\" class=\"tab {{t2}}\" aria-selected=\"{{a2}}\" onClick=\"{{toNew}}\">New request<\/button><\/div>\n\n      <sc-if value=\"{{isList}}\" hint-placeholder-val=\"{{ true }}\">\n        <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px\">\n          <sc-for list=\"{{projects}}\" as=\"p\" hint-placeholder-count=\"3\">\n            <li class=\"card lift\" style=\"padding: 22px; border-radius: 20px; display: flex; flex-direction: column; gap: 16px\">\n              <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px\"><span class=\"mono faint\" style=\"font-size: 12px\">{{p.id}} · {{p.service}}<\/span><a class=\"row-link\" style=\"font-size: 18px\" href=\"PentestProject.dc.html\">{{p.title}}<\/a><span class=\"small muted\">{{p.meta}}<\/span><\/div>\n                <div style=\"display: flex; gap: 8px; align-items: center\"><span class=\"badge dot {{p.cls}}\">{{p.stage}}<\/span><a class=\"btn btn-outline btn-sm\" href=\"PentestProject.dc.html\">{{p.cta}}<\/a><\/div>\n              <\/div>\n              <div style=\"display: flex; gap: 4px\" aria-label=\"{{p.progressLabel}}\" role=\"img\">\n                <sc-for list=\"{{p.segs}}\" as=\"g\" hint-placeholder-count=\"8\"><span style=\"flex: 1; height: 6px; border-radius: 3px; background: {{g}}\"><\/span><\/sc-for>\n              <\/div>\n            <\/li>\n          <\/sc-for>\n        <\/ul>\n      <\/sc-if>\n\n      <sc-if value=\"{{isNew}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"split\">\n          <div class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 18px\">\n            <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div><strong>Demo: request PT-212 added to the list below.<\/strong> Nothing was sent anywhere. <button type=\"button\" class=\"link-btn\" onClick=\"{{toList}}\">View projects<\/button><\/div><\/div><\/sc-if>\n            <sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n              <form style=\"display: flex; flex-direction: column; gap: 16px\" onSubmit=\"{{submit}}\" noValidate=\"{{ true }}\">\n                <div class=\"g-auto\" style=\"gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr))\">\n                  <div class=\"field\"><span class=\"label\">Organization<\/span><div class=\"input\" style=\"background: #0F1626; display: flex; align-items: center\">Qamar Retail<\/div><\/div>\n                  <div class=\"field\"><span class=\"label\">Contact<\/span><div class=\"input\" style=\"background: #0F1626; display: flex; align-items: center\">Layla Al-Mutairi · layla@qamar.example<\/div><\/div>\n                <\/div>\n                <div class=\"field\"><label class=\"label\" for=\"n-type\">Service type<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><select id=\"n-type\" class=\"select {{typeCls}}\" value=\"{{type}}\" onChange=\"{{setType}}\"><option value=\"\">Select…<\/option><option>Web<\/option><option>API<\/option><option>Mobile<\/option><option>Cloud<\/option><option>Network<\/option><option>Active Directory<\/option><option>Other<\/option><\/select><sc-if value=\"{{typeErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose a service type.<\/span><\/sc-if><\/div>\n                <div class=\"field\"><label class=\"label\" for=\"n-need\">Description of need<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><textarea id=\"n-need\" class=\"textarea {{needCls}}\" placeholder=\"High-level only. No credentials or confidential data.\" value=\"{{need}}\" onInput=\"{{setNeed}}\"><\/textarea><sc-if value=\"{{needErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>At least 30 characters.<\/span><\/sc-if><\/div>\n                <div class=\"g-auto\" style=\"gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr))\">\n                  <div class=\"field\"><label class=\"label\" for=\"n-count\">Approx. assets<\/label><input id=\"n-count\" class=\"input\" type=\"number\" min=\"1\" value=\"{{count}}\" onInput=\"{{setCount}}\"><\/div>\n                  <div class=\"field\"><label class=\"label\" for=\"n-exp\">Internal / External<\/label><select id=\"n-exp\" class=\"select\"><option>External<\/option><option>Internal<\/option><option>Both<\/option><option>Not sure<\/option><\/select><\/div>\n                  <div class=\"field\"><label class=\"label\" for=\"n-date\">Preferred start<\/label><input id=\"n-date\" class=\"input\" type=\"date\"><\/div>\n                <\/div>\n                <div class=\"field\"><label class=\"label\" for=\"n-notes\">Notes <span class=\"opt\">optional<\/span><\/label><textarea id=\"n-notes\" class=\"textarea\" style=\"min-height: 80px\"><\/textarea><\/div>\n                <label class=\"check\"><input type=\"checkbox\" checked=\"{{auth}}\" onChange=\"{{toggleAuth}}\"><span>I’m authorized to discuss testing of these assets on behalf of Qamar Retail.<span class=\"req\" aria-hidden=\"true\">*<\/span><\/span><\/label>\n                <sc-if value=\"{{authErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Confirmation is required.<\/span><\/sc-if>\n                <span class=\"demo-note\"><span class=\"i i-info i-sm\"><\/span>Demo form — nothing is sent.<\/span>\n                <button type=\"submit\" class=\"btn btn-accent btn-lg\" style=\"align-self: flex-start\" disabled=\"{{busy}}\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Submit request<\/button>\n              <\/form>\n            <\/sc-if>\n          <\/div>\n          <aside class=\"split-side\"><div class=\"alert a-purple\"><span class=\"i i-lock\"><\/span><div>Don’t send credentials, IP lists or final asset details here. They’re exchanged later in the project workspace, after scoping.<\/div><\/div><\/aside>\n        <\/div>\n      <\/sc-if>\n    <\/main>\n  <\/div>\n<\/div>\n", "Pentesting": "\n\n<div style=\"min-height: 100vh; background: #080B14; color: #F3F4F6\">\n<a class=\"skip\" href=\"#main\">Skip to content<\/a>\n<header class=\"ph\">\n  <div class=\"ph-in\">\n    <a class=\"brand\" href=\"Main.dc.html\" aria-label=\"WonderHack home\"><span class=\"brand-mark\">/$<\/span><span>WonderHack<\/span><\/a>\n    <nav class=\"ph-nav\" aria-label=\"Primary\"><a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a><a class=\"ph-link is-active\" href=\"Pentesting.dc.html\" aria-current=\"page\">Pentesting<\/a><a class=\"ph-link\" href=\"Info.dc.html\">How It Works<\/a><a class=\"ph-link\" href=\"Main.dc.html#faq\">FAQ<\/a><\/nav>\n    <div class=\"ph-actions\"><a class=\"btn btn-primary\" href=\"Auth.dc.html\">Explore Demo<\/a><\/div>\n    <button class=\"btn btn-outline btn-icon ph-burger\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"{{menuExpanded}}\" onClick=\"{{toggleMenu}}\"><span class=\"i {{menuIcon}}\"><\/span><\/button>\n  <\/div>\n  <sc-if value=\"{{menuOpen}}\" hint-placeholder-val=\"{{ false }}\">\n    <nav class=\"ph-mobile\" aria-label=\"Mobile\"><a class=\"ph-link\" href=\"PublicOpportunities.dc.html\">Opportunities<\/a><a class=\"ph-link\" href=\"Pentesting.dc.html\">Pentesting<\/a><a class=\"ph-link\" href=\"Info.dc.html\">How It Works<\/a><div style=\"display: flex; gap: 8px; padding-top: 8px\"><a class=\"btn btn-primary\" style=\"flex: 1\" href=\"Auth.dc.html\">Explore Demo<\/a><\/div><\/nav>\n  <\/sc-if>\n<\/header>\n\n<main id=\"main\">\n  <section class=\"hero\" style=\"padding: 72px 0 56px\">\n    <div class=\"gridbg\"><\/div>\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 22px; max-width: 980px; margin-inline: auto\">\n      <span class=\"eyebrow\">Professional Pentesting<\/span>\n      <h1 class=\"display\" style=\"font-size: clamp(38px, 5.4vw, 64px)\">A scoped engagement, run by <span class=\"grad-text\">WonderHack’s testing team<\/span>.<\/h1>\n      <p class=\"lead\">Tell us what needs testing. We scope it with you, send a quotation, and start only after written authorization and Rules of Engagement are in place. You track every stage in your workspace.<\/p>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px\"><a class=\"btn btn-accent btn-lg\" href=\"#request\">Request a pentest<\/a><a class=\"btn btn-outline btn-lg\" href=\"#process\">See the process<\/a><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"section\" aria-labelledby=\"svc\">\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end\"><h2 id=\"svc\" class=\"h1\">Services<\/h2><span class=\"small faint\">The service list is managed by WonderHack administration.<\/span><\/div>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px\">\n        <sc-for list=\"{{services}}\" as=\"s\" hint-placeholder-count=\"6\">\n          <button type=\"button\" class=\"card lift\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px; border-radius: 20px; text-align: start; color: #F3F4F6; cursor: pointer\" onClick=\"{{s.pick}}\" aria-label=\"{{s.aria}}\">\n            <span class=\"choice-ic\"><span class=\"i {{s.icon}}\"><\/span><\/span>\n            <span class=\"h3\">{{s.label}}<\/span>\n            <span class=\"p\" style=\"font-size: 14px\">{{s.body}}<\/span>\n            <span class=\"small\" style=\"color: #9CC4FF; display: inline-flex; gap: 6px; align-items: center; margin-top: auto\">Request this test<span class=\"i i-arrow-right i-sm i-flip\"><\/span><\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"process\" class=\"section\" aria-labelledby=\"proc\">\n    <div class=\"mk-wrap\" style=\"display: flex; flex-direction: column; gap: 28px\">\n      <h2 id=\"proc\" class=\"h1\">How an engagement moves<\/h2>\n      <ol class=\"stepper card\" style=\"padding: 26px 22px; border-radius: 22px\">\n        <li class=\"step is-done\"><span class=\"step-dot\">1<\/span><span class=\"step-label\">New Request<\/span><\/li>\n        <li class=\"step is-done\"><span class=\"step-dot\">2<\/span><span class=\"step-label\">Scoping<\/span><\/li>\n        <li class=\"step is-done\"><span class=\"step-dot\">3<\/span><span class=\"step-label\">Quotation Sent<\/span><\/li>\n        <li class=\"step is-current\"><span class=\"step-dot\">4<\/span><span class=\"step-label\">Approved<\/span><\/li>\n        <li class=\"step\"><span class=\"step-dot\">5<\/span><span class=\"step-label\">Scheduled<\/span><\/li>\n        <li class=\"step\"><span class=\"step-dot\">6<\/span><span class=\"step-label\">In Progress<\/span><\/li>\n        <li class=\"step\"><span class=\"step-dot\">7<\/span><span class=\"step-label\">Report Delivered<\/span><\/li>\n        <li class=\"step\"><span class=\"step-dot\">8<\/span><span class=\"step-label\">Closed<\/span><\/li>\n      <\/ol>\n      <div class=\"alert a-purple\"><span class=\"i i-shield\"><\/span><div>Accepting a quotation does not replace written authorization, the scope agreement or Rules of Engagement. Testing starts only when all three are complete.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"request\" class=\"section\" aria-labelledby=\"req\">\n    <div class=\"mk-wrap split\" style=\"align-items: start\">\n      <div class=\"card\" style=\"padding: clamp(22px, 3vw, 34px); border-radius: 24px; display: flex; flex-direction: column; gap: 20px\">\n        <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\" role=\"status\">\n            <span class=\"state-ic\" style=\"background: rgba(52,211,153,.12); color: #6EE7B7; border-color: rgba(52,211,153,.4)\"><span class=\"i i-check-circle i-xl\"><\/span><\/span>\n            <h2 class=\"h1\" style=\"font-size: 28px\">Request preview (demo)<\/h2>\n            <p class=\"p\">This is a demo, so nothing was sent or saved. In the real product, the WonderHack team would contact <strong style=\"color: #F3F4F6\">{{email}}<\/strong> to start scoping, and the request would appear in the company workspace.<\/p>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px\"><a class=\"btn btn-primary\" href=\"PentestProjects.dc.html\">Open the company demo<\/a><\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\"><h2 id=\"req\" class=\"h1\" style=\"font-size: 30px\">Request a pentest<\/h2><p class=\"sub\" style=\"margin: 0\">No credentials or sensitive details here. Those are exchanged later in your secure project workspace.<\/p><\/div>\n          <form style=\"display: flex; flex-direction: column; gap: 16px\" onSubmit=\"{{submit}}\" noValidate=\"{{ true }}\">\n            <div class=\"g-auto\" style=\"gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr))\">\n              <div class=\"field\"><label class=\"label\" for=\"r-org\">Organization<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"r-org\" class=\"input {{c.org}}\" autoComplete=\"organization\" value=\"{{org}}\" onInput=\"{{set.org}}\"><sc-if value=\"{{e.org}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Enter the organization name.<\/span><\/sc-if><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"r-contact\">Contact person<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"r-contact\" class=\"input {{c.contact}}\" autoComplete=\"name\" value=\"{{contact}}\" onInput=\"{{set.contact}}\"><sc-if value=\"{{e.contact}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Enter a contact name.<\/span><\/sc-if><\/div>\n            <\/div>\n            <div class=\"field\"><label class=\"label\" for=\"r-email\">Professional email<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"r-email\" class=\"input {{c.email}}\" type=\"email\" autoComplete=\"email\" value=\"{{email}}\" onInput=\"{{set.email}}\"><sc-if value=\"{{e.email}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>{{emailMsg}}<\/span><\/sc-if><span class=\"help\">Use your company domain. Free email providers are flagged for review.<\/span><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"r-type\">Service type<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><select id=\"r-type\" class=\"select {{c.type}}\" value=\"{{type}}\" onChange=\"{{set.type}}\"><option value=\"\">Select…<\/option><option>Web<\/option><option>API<\/option><option>Mobile<\/option><option>Cloud<\/option><option>Network<\/option><option>Active Directory<\/option><option>Other<\/option><\/select><sc-if value=\"{{e.type}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose a service type.<\/span><\/sc-if><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"r-need\">What do you need tested?<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><textarea id=\"r-need\" class=\"textarea {{c.need}}\" placeholder=\"Describe the system and your goals at a high level. No credentials, IP lists or confidential data.\" value=\"{{need}}\" onInput=\"{{set.need}}\"><\/textarea><sc-if value=\"{{e.need}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>At least 30 characters.<\/span><\/sc-if><\/div>\n            <div class=\"g-auto\" style=\"gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr))\">\n              <div class=\"field\"><label class=\"label\" for=\"r-count\">Approx. asset count<\/label><input id=\"r-count\" class=\"input {{c.count}}\" type=\"number\" min=\"1\" inputMode=\"numeric\" value=\"{{count}}\" onInput=\"{{set.count}}\"><sc-if value=\"{{e.count}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Enter a number from 1.<\/span><\/sc-if><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"r-exp\">Internal / External<\/label><select id=\"r-exp\" class=\"select\" value=\"{{exposure}}\" onChange=\"{{set.exposure}}\"><option value=\"\">Not sure<\/option><option>External<\/option><option>Internal<\/option><option>Both<\/option><\/select><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"r-date\">Preferred start<\/label><input id=\"r-date\" class=\"input\" type=\"date\" value=\"{{date}}\" onInput=\"{{set.date}}\"><\/div>\n            <\/div>\n            <div class=\"field\"><label class=\"label\" for=\"r-notes\">Notes <span class=\"opt\">optional<\/span><\/label><textarea id=\"r-notes\" class=\"textarea\" style=\"min-height: 80px\" value=\"{{notes}}\" onInput=\"{{set.notes}}\"><\/textarea><\/div>\n            <label class=\"check\"><input type=\"checkbox\" checked=\"{{auth}}\" onChange=\"{{toggleAuth}}\"><span>I confirm I’m authorized by my organization to discuss testing of these assets.<span class=\"req\" aria-hidden=\"true\">*<\/span><\/span><\/label>\n            <sc-if value=\"{{e.auth}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Confirmation is required.<\/span><\/sc-if>\n            <sc-if value=\"{{serverErr}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert a-err\" role=\"alert\"><span class=\"i i-alert\"><\/span><div>Request not sent (<span class=\"mono\">429<\/span> — too many requests). Nothing was saved. Try again in a minute.<\/div><\/div><\/sc-if>\n            <span class=\"demo-note\"><span class=\"i i-info i-sm\"><\/span>Demo form — nothing you enter is sent or stored.<\/span>\n            <button type=\"submit\" class=\"btn btn-accent btn-lg\" disabled=\"{{busy}}\"><sc-if value=\"{{busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>{{submitLabel}}<\/button>\n          <\/form>\n        <\/sc-if>\n      <\/div>\n      <aside class=\"split-side\">\n        \n        <section class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 12px\">\n          <h2 class=\"h3\">What happens next<\/h2>\n          <ol class=\"tl\"><li><span class=\"tl-dot\"><\/span><div class=\"tl-title\">Scoping call<\/div><div class=\"tl-body\">We agree on assets, approach and constraints.<\/div><\/li><li><span class=\"tl-dot p\"><\/span><div class=\"tl-title\">Quotation<\/div><div class=\"tl-body\">Shared in your workspace for review and acceptance.<\/div><\/li><li><span class=\"tl-dot a\"><\/span><div class=\"tl-title\">Written authorization + RoE<\/div><div class=\"tl-body\">Required before any testing.<\/div><\/li><li><span class=\"tl-dot g\"><\/span><div class=\"tl-title\">Testing and report<\/div><div class=\"tl-body\">Final report delivered through private, authorized download.<\/div><\/li><\/ol>\n        <\/section>\n      <\/aside>\n    <\/div>\n  <\/section>\n<\/main>\n<footer class=\"ft\"><div class=\"mk-wrap\" style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\"><a class=\"brand\" href=\"Main.dc.html\"><span class=\"brand-mark\">/$<\/span><span>WonderHack<\/span><\/a><nav aria-label=\"Footer\" style=\"display: flex; flex-wrap: wrap; gap: 20px\"><a href=\"Info.dc.html\">About<\/a><a href=\"Info.dc.html\">Contact<\/a><a href=\"Info.dc.html\">Privacy Policy<\/a><a href=\"Info.dc.html\">Terms<\/a><a href=\"Info.dc.html\">Responsible Disclosure<\/a><\/nav><\/div><\/footer>\n<\/div>\n", "ProgramEditor": "\n\n<div class=\"app\">\n  <dc-import name=\"AppSidebar\" role=\"company\" active=\"programs\" hint-size=\"268px,100vh\"><\/dc-import>\n  <div class=\"app-main\">\n    <dc-import name=\"AppTopbar\" role=\"company\" active=\"programs\" section=\"New program\" hint-size=\"100%,68px\"><\/dc-import>\n    <main class=\"page\" id=\"main\">\n      <nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"CompanyPrograms.dc.html\">Programs / Requests<\/a><span class=\"i i-chev-right i-sm i-flip\"><\/span><span>New program<\/span><\/nav>\n      <div class=\"page-head\"><div style=\"display: flex; flex-direction: column; gap: 8px\"><h1 class=\"h1\">{{headTitle}}<\/h1><p class=\"sub\" style=\"margin: 0\">Demo — nothing on this form is sent anywhere. Public programs go live only after WonderHack approves them.<\/p><\/div><span class=\"badge dot b-gray\">{{saveState}}<\/span><\/div>\n\n      <ol class=\"stepper card\" style=\"padding: 20px; border-radius: 20px; margin-bottom: 22px\" aria-label=\"Steps\">\n        <sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"6\">\n          <li class=\"step {{st.cls}}\"><button type=\"button\" class=\"step-dot\" style=\"cursor: pointer\" aria-label=\"{{st.aria}}\" aria-current=\"{{st.current}}\" onClick=\"{{st.go}}\">{{st.n}}<\/button><span class=\"step-label\">{{st.label}}<\/span><\/li>\n        <\/sc-for>\n      <\/ol>\n\n      <div class=\"split\">\n        <form class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 20px; min-width: 0\" onSubmit=\"{{next}}\" noValidate=\"{{ true }}\">\n          <!-- BASICS -->\n          <sc-if value=\"{{s1}}\" hint-placeholder-val=\"{{ true }}\">\n            <h2 class=\"h2\">Basics<\/h2>\n            <div class=\"field\"><label class=\"label\" for=\"p-title\">Title<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"p-title\" class=\"input {{e.titleCls}}\" value=\"{{f.title}}\" onInput=\"{{set.title}}\"><sc-if value=\"{{e.title}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Enter a title (at least 5 characters).<\/span><\/sc-if><\/div>\n            <div class=\"field\"><span class=\"label\">Organization<\/span><div class=\"input\" style=\"display: flex; align-items: center; gap: 10px; background: #0F1626\"><span class=\"logo logo-sm\" style=\"background: linear-gradient(135deg,#2563EB,#7C3AED); width: 24px; height: 24px; font-size: 10px; border-radius: 7px\">QR<\/span>Qamar Retail<\/div><\/div>\n            <fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px\"><legend class=\"label\" style=\"margin-bottom: 10px\">Opportunity type<span class=\"req\" aria-hidden=\"true\">*<\/span><\/legend>\n              <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px\">\n                <sc-for list=\"{{types}}\" as=\"t\" hint-placeholder-count=\"3\"><button type=\"button\" class=\"choice {{t.cls}}\" aria-pressed=\"{{t.pressed}}\" onClick=\"{{t.pick}}\"><span class=\"choice-ic\"><span class=\"i {{t.icon}}\"><\/span><\/span><span style=\"display: flex; flex-direction: column; gap: 3px\"><span class=\"h4\">{{t.label}}<\/span><span class=\"small muted\">{{t.desc}}<\/span><\/span><\/button><\/sc-for>\n              <\/div>\n            <\/fieldset>\n            <div class=\"g-auto\" style=\"gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr))\">\n              <div class=\"field\"><label class=\"label\" for=\"p-vis\">Visibility<\/label><select id=\"p-vis\" class=\"select\" value=\"{{f.vis}}\" onChange=\"{{set.vis}}\"><option value=\"Public\">Public (needs approval)<\/option><option value=\"Private\">Private (invited only)<\/option><\/select><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"p-start\">Start date<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><input id=\"p-start\" class=\"input {{e.startCls}}\" type=\"date\" value=\"{{f.start}}\" onInput=\"{{set.start}}\"><sc-if value=\"{{e.start}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose a start date.<\/span><\/sc-if><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"p-end\">End date <span class=\"opt\">optional<\/span><\/label><input id=\"p-end\" class=\"input {{e.endCls}}\" type=\"date\" value=\"{{f.end}}\" onInput=\"{{set.end}}\"><sc-if value=\"{{e.end}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Must be after the start date.<\/span><\/sc-if><\/div>\n            <\/div>\n            <div class=\"field\"><label class=\"label\" for=\"p-desc\">Description and objective<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label><textarea id=\"p-desc\" class=\"textarea {{e.descCls}}\" value=\"{{f.desc}}\" onInput=\"{{set.desc}}\"><\/textarea><sc-if value=\"{{e.desc}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>At least 40 characters.<\/span><\/sc-if><\/div>\n          <\/sc-if>\n\n          <!-- SCOPE -->\n          <sc-if value=\"{{s2}}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 class=\"h2\">Scope<\/h2>\n            <h3 class=\"h4\">In-scope assets<span class=\"req\" aria-hidden=\"true\">*<\/span><\/h3>\n            <div style=\"display: flex; flex-direction: column; gap: 10px\">\n              <sc-for list=\"{{inScope}}\" as=\"a\" hint-placeholder-count=\"2\">\n                <div style=\"display: grid; grid-template-columns: minmax(0, 2fr) minmax(110px, 1fr) auto auto; gap: 8px; align-items: center\">\n                  <label class=\"sr-only\" for=\"{{a.idA}}\">Asset<\/label><input id=\"{{a.idA}}\" class=\"input mono\" style=\"font-size: 13.5px\" placeholder=\"app.example.com\" value=\"{{a.asset}}\" onInput=\"{{a.setAsset}}\">\n                  <label class=\"sr-only\" for=\"{{a.idK}}\">Type<\/label><select id=\"{{a.idK}}\" class=\"select\" value=\"{{a.kind}}\" onChange=\"{{a.setKind}}\"><option>Web<\/option><option>API<\/option><option>Mobile<\/option><option>Cloud<\/option><option>Network<\/option><\/select>\n                  <label class=\"check\" style=\"white-space: nowrap\"><input type=\"checkbox\" checked=\"{{a.eligible}}\" onChange=\"{{a.toggle}}\">Reward<\/label>\n                  <button type=\"button\" class=\"btn btn-ghost btn-icon\" aria-label=\"{{a.removeLabel}}\" onClick=\"{{a.remove}}\"><span class=\"i i-x i-sm\"><\/span><\/button>\n                <\/div>\n              <\/sc-for>\n              <button type=\"button\" class=\"btn btn-outline btn-sm\" style=\"align-self: flex-start\" onClick=\"{{addIn}}\"><span class=\"i i-plus i-sm\"><\/span>Add asset<\/button>\n              <sc-if value=\"{{e.scope}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Add at least one in-scope asset.<\/span><\/sc-if>\n            <\/div>\n            <div class=\"field\"><label class=\"label\" for=\"p-out\">Out of scope / exclusions<\/label><textarea id=\"p-out\" class=\"textarea mono\" style=\"font-size: 13.5px; min-height: 96px\" placeholder=\"One per line, with reason\" value=\"{{f.out}}\" onInput=\"{{set.out}}\"><\/textarea><\/div>\n          <\/sc-if>\n\n          <!-- RULES -->\n          <sc-if value=\"{{s3}}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 class=\"h2\">Rules<\/h2>\n            <div class=\"field\"><label class=\"label\" for=\"p-rules\">Participation rules<span class=\"req\" ari eward}}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n              <h2 class=\"h4\" style=\"display: flex; align-items: center; gap: 8px\"><span class=\"i i-award\" style=\"color: #B49CFF\"><\/span>Reward record<\/h2>\n              <span class=\"mono\" style=\"font-size: 20px\">$1,500 · Proposed<\/span>\n              <span class=\"help\">Administrative record only. No payment is made through WonderHack.<\/span>\n            <\/section>\n          <\/sc-if>\n\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h4\">History<\/h2>\n            <ol class=\"tl\">\n              <sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"3\"><li><span class=\"tl-dot {{h.dot}}\"><\/span><div class=\"tl-title\">{{h.title}}<\/div><div class=\"tl-meta\">{{h.meta}}<\/div><sc-if value=\"{{h.hasReason}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"tl-body\">“{{h.reason}}”<\/div><\/sc-if><\/li><\/sc-for>\n            <\/ol>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"toast toast-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div style=\"flex: 1\">{{toastText}}<\/div><button type=\"button\" class=\"btn btn-ghost btn-icon\" style=\"width: 32px; height: 32px; min-height: 32px\" aria-label=\"Dismiss\" onClick=\"{{dismiss}}\"><span class=\"i i-x i-sm\"><\/span><\/button><\/div>\n<\/sc-if>\n", "ReportDetailCompany": "\n\n<div class=\"app\">\n  <sc-if value=\"{{isResearcher}}\" hint-placeholder-val=\"{{ true }}\"><dc-import name=\"AppSidebar\" role=\"researcher\" active=\"submissions\" hint-size=\"268px,100vh\"><\/dc-import><\/sc-if>\n  <sc-if value=\"{{isCompany}}\" hint-placeholder-val=\"{{ false }}\"><dc-import name=\"AppSidebar\" role=\"compa n        <\/div>\n      <\/header>\n\n      <sc-if value=\"{{needsInfoBanner}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"alert a-warn\" role=\"status\" style=\"margin-bottom: 18px\"><span class=\"i i-message\"><\/span><div><strong>Triage asked for more information.<\/strong> Reply in the conversation below. The report stays on hold until you respond.<\/div><\/div>\n      <\/sc-if>\n\n      <div class=\"split\">\n        <div style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0\">\n          <section class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 14px\" aria-labelledby=\"desc-h\">\n            <h2 id=\"desc-h\" class=\"h3\">Description<\/h2>\n            <p class=\"msg-text\">{{report.description}}<\/p>\n            <h3 class=\"h4\">Steps to reproduce<\/h3>\n            <pre class=\"code\">{{report.steps}}<\/pre>\n            <h3 class=\"h4\">Impact<\/h3>\n            <p class=\"msg-text\">{{report.impact}}<\/p>\n            <div class=\"alert a-info\" style=\"font-size: 13px\"><span class=\"i i-info\"><\/span><div>All report text is rendered as plain text. Markup such as {{report.markupSample}} is displayed literally and never interpreted as HTML.<\/div><\/div>\n          <\/section>\n\n          <section class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 12px\" aria-labelledby=\"att-h\">\n            <h2 id=\"att-h\" class=\"h3\">Attachments<\/h2>\n            <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px\">\n              <sc-for list=\"{{attachments}}\" as=\"f\" hint-placeholder-count=\"2\">\n                <li class=\"file\"><span class=\"file-ic\"><span class=\"i i-clip i-sm\"><\/span><\/span><div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column\"><span style=\"font-size: 14px\">{{f.name}}<\/span><span class=\"faint mono\" style=\"font-size: 12px\">{{f.meta}}<\/span><\/div><button type=\"button\" class=\"btn btn-outline btn-sm\" onClick=\"{{f.get}}\" disabled=\"{{f.busy}}\"><sc-if value=\"{{f.busy}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if><span class=\"i i-download i-sm\"><\/span>Download<\/button><\/li>\n              <\/sc-for>\n            <\/ul>\n            <span class=\"help\">Files are private to authorized people. Downloads are disabled in this demo.<\/span>\n          <\/section>\n\n          <section class=\"card\" style=\"overflow: hidden\" aria-labelledby=\"conv-h\">\n            <div class=\"card-head\"><h2 id=\"conv-h\" class=\"h3\">Conversation<\/h2><span class=\"small faint\">{{convNote}}<\/span><\/div>\n            <div class=\"card-body\" style=\"display: flex; flex-direction: column; gap: 18px\">\n              <div class=\"thread\">\n                <sc-for list=\"{{messages}}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <article class=\"msg {{m.cls}}\">\n                    <span class=\"avatar avatar-sm\" style=\"background: {{m.avBg}}\" aria-hidden=\"true\">{{m.ini}}<\/span>\n                    <div class=\"msg-body\">\n                      <div class=\"msg-head\"><strong>{{m.author}}<\/strong><span class=\"faint\">{{m.role}}<\/span><span class=\"faint mono\" style=\"font-size: 12px\">{{m.time}}<\/span><sc-if value=\"{{m.internal}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge b-amber\"><span class=\"i i-lock i-sm\"><\/span>Internal note — not visible to researcher or company<\/span><\/sc-if><sc-if value=\"{{m.request}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge b-amber\">Clarification request<\/span><\/sc-if><\/div>\n                      <p class=\"msg-text\">{{m.text}}<\/p>\n                    <\/div>\n                  <\/article>\n                <\/sc-for>\n              <\/div>\n\n              <sc-if value=\"{{canCompose}}\" hint-placeholder-val=\"{{ true }}\">\n                <form style=\"display: flex; flex-direction: column; gap: 10px\" onSubmit=\"{{send}}\">\n                  <sc-if value=\"{{isTriage}}\" hint-placeholder-val=\"{{ false }}\">\n                    <div class=\"seg\" role=\"group\" aria-label=\"Message type\">\n                      <button type=\"button\" class=\"{{modeReplyCls}}\" aria-pressed=\"{{modeReplyPressed}}\" onClick=\"{{modeReply}}\">Reply to researcher<\/button>\n                      <button type=\"button\" class=\"{{modeNoteCls}}\" aria-pressed=\"{{modeNotePressed}}\" onClick=\"{{modeNote}}\"><span class=\"i i-lock i-sm\"><\/span>Internal note<\/button>\n                    <\/div>\n                  <\/sc-if>\n                  <div class=\"composer {{composerCls}}\">\n                    <label class=\"sr-only\" for=\"msg\">{{composeLabel}}<\/label>\n                    <textarea id=\"msg\" class=\"textarea\" placeholder=\"{{composePlaceholder}}\" value=\"{{draft}}\" onInput=\"{{setDraft}}\"><\/textarea>\n                    <div class=\"composer-bar\">\n                      <span class=\"small {{composeHintCls}}\">{{composeHint}}<\/span>\n                      <button type=\"submit\" class=\"btn btn-primary btn-sm\" disabled=\"{{sendDisabled}}\"><sc-if value=\"{{sending}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if><span class=\"i i-send i-sm\"><\/span>{{sendLabel}}<\/button>\n                    <\/div>\n                  <\/div>\n                <\/form>\n              <\/sc-if>\n              <sc-if value=\"{{cannotCompose}}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"alert a-info\"><span class=\"i i-info\"><\/span><div>Your role can read this conversation. Replies to the researcher are sent by WonderHack triage.<\/div><\/div>\n              <\/sc-if>\n            <\/div>\n          <\/section>\n        <\/div>\n\n        <aside class=\"split-side\" aria-label=\"Status and details\">\n          <!-- triage decision -->\n          <sc-if value=\"{{isTriage}}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <h2 class=\"h3\">Decision<\/h2>\n              <form style=\"display: flex; flex-direction: column; gap: 12px\" onSubmit=\"{{saveDecision}}\" noValidate=\"{{ true }}\">\n                <div class=\"field\">\n                  <label class=\"label\" for=\"d-status\">New status<\/label>\n                  <select id=\"d-status\" class=\"select\" value=\"{{nextStatus}}\" onChange=\"{{setNext}}\">\n                    <option value=\"\">Keep “{{status}}”<\/option>\n                    <sc-for list=\"{{allowed}}\" as=\"t\" hint-placeholder-count=\"2\"><option value=\"{{t}}\">{{t}}<\/option><\/sc-for>\n                  <\/select>\n                  <span class=\"help\">Only transitions the API allows from “{{status}}” are listed.<\/span>\n                <\/div>\n                <div class=\"field\">\n                  <label class=\"label\" for=\"d-sev\">Severity<\/label>\n                  <select id=\"d-sev\" class=\"select\" value=\"{{nextSev}}\" onChange=\"{{setSev}}\"><option>Low<\/option><option>Medium<\/option><option>High<\/option><option>Critical<\/option><\/select>\n                <\/div>\n                <sc-if value=\"{{isDuplicate}}\" hint-placeholder-val=\"{{ false }}\">\n                  <div class=\"field\"><label class=\"label\" for=\"d-orig\">Original report ID <span class=\"opt\">internal only<\/span><\/label><input id=\"d-orig\" class=\"input mono\" placeholder=\"WH-…\"><span class=\"help\">The researcher sees “Duplicate” only — never the other report.<\/span><\/div>\n                <\/sc-if>\n                <div class=\"field\">\n                  <label class=\"label\" for=\"d-reason\">Reason<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n                  <textarea id=\"d-reason\" class=\"textarea {{reasonCls}}\" style=\"min-height: 84px\" placeholder=\"Shown to the researcher with the status change\" value=\"{{reason}}\" onInput=\"{{setReason}}\"><\/textarea>\n                  <sc-if value=\"{{reasonErr}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>A reason is required for every decision.<\/span><\/sc-if>\n                <\/div>\n                <button type=\"submit\" class=\"btn btn-primary\" disabled=\"{{deciding}}\"><sc-if value=\"{{deciding}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"spin\"><\/span><\/sc-if>Save decision<\/button>\n              <\/form>\n            <\/section>\n          <\/sc-if>\n\n          <!-- company actions -->\n          <sc-if value=\"{{isCompany}}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n              <h2 class=\"h3\">Your actions<\/h2>\n              <sc-if value=\"{{companyCanResolve}}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"btn btn-primary\" onClick=\"{{resolve}}\">Mark as Resolved<\/button><\/sc-if>\n              <sc-if value=\"{{companyNoActions}}\" hint-placeholder-val=\"{{ true }}\"><p class=\"p\" style=\"font-size: 14px\">No actions are available to your role while the report is “{{status}}”. Actions appear here when your role is allowed to take them.<\/p><\/sc-if>\n            <\/section>\n          <\/sc-if>\n\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h4\">Details<\/h2>\n            <dl class=\"kv\" style=\"font-size: 13.5px\">\n              <dt>Program<\/dt><dd>Qamar Retail · Storefront Bug Bounty<\/dd>\n              <dt>Asset<\/dt><dd class=\"mono\" style=\"font-size: 12.5px\">shop.qamar.example<\/dd>\n              <dt>Type<\/dt><dd>Cross-site scripting (XSS)<\/dd>\n              <dt>Suggested<\/dt><dd>High (researcher)<\/dd>\n              <dt>CVSS<\/dt><dd class=\"mono\" style=\"font-size: 12px\">Not provided<\/dd>\n              <dt>Assigned<\/dt><dd>Noor Haddad (Triage)<\/dd>\n            <\/dl>\n          <\/section>\n\n          <sc-if value=\"{{showReward}}\" hint-placeholder-val=\"{{ false }}\">\n            <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 8px\">\n              <h2 class=\"h4\" style=\"display: flex; align-items: center; gap: 8px\"><span class=\"i i-award\" style=\"color: #B49CFF\"><\/span>Reward record<\/h2>\n              <span class=\"mono\" style=\"font-size: 20px\">$1,500 · Proposed<\/span>\n              <span class=\"help\">Administrative record only. No payment is made through WonderHack.<\/span>\n            <\/section>\n          <\/sc-if>\n\n          <section class=\"card\" style=\"padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 class=\"h4\">History<\/h2>\n            <ol class=\"tl\">\n              <sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"3\"><li><span class=\"tl-dot {{h.dot}}\"><\/span><div class=\"tl-title\">{{h.title}}<\/div><div class=\"tl-meta\">{{h.meta}}<\/div><sc-if value=\"{{h.hasReason}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"tl-body\">“{{h.reason}}”<\/div><\/sc-if><\/li><\/sc-for>\n            <\/ol>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"toast toast-ok\" role=\"status\"><span class=\"i i-check-circle\"><\/span><div style=\"flex: 1\">{{toastText}}<\/div><button type=\"button\" class=\"btn btn-ghost btn-icon\" style=\"width: 32px; height: 32px; min-height: 32px\" aria-label=\"Dismiss\" onClick=\"{{dismiss}}\"><span class=\"i i-x i-sm\"><\/span><\/button><\/div>\n<\/sc-if>\n", "SubmitReport": "\n\n<div class=\"app\">\n  <dc-import name=\"AppSidebar\" role=\"researcher\" active=\"submissions\" hint-size=\"268px,100vh\"><\/dc-import>\n  <div class=\"app-main\">\n    <dc-import name=\"AppTopbar\" role=\"researcher\" active=\"submissions\" section=\"Submit report\" hint-size=\"100%,68px\"><\/dc-import>\n    <main class=\"page\" id=\"main\">\n      <nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a href=\"Opportunities.dc.html\">Opportunities<\/a><span class=\"i i-chev-right i-sm i-flip\"><\/span><a href=\"OpportunityDetail.dc.html\">Storefront Bug Bounty<\/a><span class=\"i i-chev-right i-sm i-flip\"><\/span><span>Submit report<\/span><\/nav>\n\n      <!-- SUCCESS -->\n      <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{ false }}\">\n        <section class=\"state\" style=\"border-style: solid; border-color: rgba(52,211,153,.4); max-width: 720px; margin-inline: auto\" role=\"status\">\n          <span class=\"state-ic\" style=\"background: rgba(52,211,153,.12); color: #6EE7B7; border-color: rgba(52,211,153,.4)\"><span class=\"i i-check-circle i-xl\"><\/span><\/span>\n          <h1 class=\"h1\">Report submitted (demo)<\/h1>\n          <p class=\"p\" style=\"max-width: 520px\">This is a preview — nothing was submitted or saved. In the real product the report would start as <span class=\"badge dot b-blue\">Submitted<\/span> and triage would review it.<\/p>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; justify-content: center\"><a class=\"btn btn-primary\" href=\"ReportDetail.dc.html\">View report<\/a><a class=\"btn btn-outline\" href=\"MySubmissions.dc.html\">Go to My Submissions<\/a><\/div>\n        <\/section>\n      <\/sc-if>\n\n      <sc-if value=\"{{notDone}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"page-head\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\"><h1 class=\"h1\">Submit a vulnerability report<\/h1><p class=\"sub\" style=\"margin: 0\">Describe one vulnerability per report. Fields marked <span style=\"color: #FCA5A5\">*<\/span> are required.<\/p><\/div>\n        <\/div>\n\n        <div class=\"split\">\n          <form style=\"display: flex; flex-direction: column; gap: 18px; min-width: 0\" onSubmit=\"{{submit}}\" noValidate=\"{{ true }}\" aria-busy=\"{{busyStr}}\">\n            <sc-if value=\"{{showSummary}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"alert a-err\" role=\"alert\" tabIndex=\"-1\">\n                <span class=\"i i-alert\"><\/span>\n                <div style=\"display: flex; flex-direction: column; gap: 6px\"><strong>Fix {{errCount}} field(s) before submitting:<\/strong>\n                  <ul style=\"margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 2px\"><sc-for list=\"{{errList}}\" as=\"er\" hint-placeholder-count=\"2\"><li><a href=\"{{er.href}}\" style=\"color: #FFD9D9\">{{er.label}}<\/a><\/li><\/sc-for><\/ul>\n                <\/div>\n              <\/div>\n            <\/sc-if>\n            <sc-if value=\"{{serverErr}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"alert a-err\" role=\"alert\"><span class=\"i i-alert\"><\/span><div><strong>Report not submitted.<\/strong> Nothing was saved; your draft is still here. Try again.<\/div><\/div>\n            <\/sc-if>\n\n            <section class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 18px\">\n              <h2 class=\"h3\">Program and target<\/h2>\n              <div class=\"g-auto\" style=\"gap: 16px\">\n                <div class=\"field\">\n                  <label class=\"label\" for=\"f-program\">Program<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n                  <select id=\"f-program\" class=\"select {{c.program}}\" value=\"{{program}}\" onChange=\"{{setProgram}}\" aria-invalid=\"{{a.program}}\">\n                    <option value=\"\">Select a program…<\/option>\n                    <option value=\"qamar\">Qamar Retail — Storefront Bug Bounty<\/option>\n                    <option value=\"najm\">Najm Clinics — Patient Portal (No Bounty)<\/option>\n                    <option value=\"sahel\">Sahel Freight — Fleet Tracking Mobile App<\/option>\n                    <option value=\"mirqab\">Mirqab Telecom — Self-Service Portal (private)<\/option>\n                    <option value=\"dhow\" disabled=\"{{ true }}\">Dhow Pay — Payments API (requires approval)<\/option>\n                  <\/select>\n                  <sc-if value=\"{{e.program}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose the program this vulnerability belongs to.<\/span><\/sc-if>\n                  <span class=\"help\">Only programs you’re eligible to report to are listed.<\/span>\n                <\/div>\n                <div class=\"field\">\n                  <label class=\"label\" for=\"f-asset\">Affected asset<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n                  <select id=\"f-asset\" class=\"select {{c.asset}}\" value=\"{{asset}}\" onChange=\"{{setAsset}}\" disabled=\"{{noProgram}}\" aria-invalid=\"{{a.asset}}\">\n                    <option value=\"\">{{assetPlaceholder}}<\/option>\n                    <sc-for list=\"{{assets}}\" as=\"x\" hint-placeholder-count=\"3\"><option value=\"{{x}}\">{{x}}<\/option><\/sc-for>\n                  <\/select>\n                  <sc-if value=\"{{e.asset}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"err\"><span class=\"i i-alert i-sm\"><\/span>Choose an in-scope asset.<\/span><\/sc-if>\n                  <span class=\"help\">Only in-scope assets are listed. Out-of-scope findings can’t be submitted.<\/span>\n                <\/div>\n              <\/div>\n            <\/section>\n\n            <section class=\"card card-pad\" style=\"display: flex; flex-direction: column; gap: 18px\">\n              <h2 class=\"h3\">Vulnerability<\/h2>\n              <div class=\"field\">\n                <label class=\"label\" for=\"f-title\">Vulnerability title<span class=\"req\" aria-hidden=\"true\">*<\/span><\/label>\n                <input id=\"f-title\" class=\"input {{c.title}}\" type=\"text\" maxLength=\"150\" pla         uploading: f.status === 'uploading', failed: f.status === 'error', canRetry: f.status === 'error' && f.retryable,
        pct: String(f.pct), pctW: f.pct + '%', barLabel: 'Uploading ' + f.name,
        removeLabel: 'Remove ' + f.name,
        remove: () => { clearInterval(this.timers[f.id]); this.setState({ files: this.state.files.filter((x) => x.id !== f.id) }); },
        retry: () => { this.setState({ files: this.state.files.map((x) => x.id === f.id ? { ...x, pct: 0, status: 'uploading', error: '' } : x) }); this.startUpload(f.id); }
      })),
      addSample: () => {
        const SAMPLES = [['login-flow-redacted.png', 512000], ['request-response.txt', 4200], ['repro-video.mp4', 8400000], ['setup.exe', 90000]];
        const pick = SAMPLES[(this.nextId - 2) % SAMPLES.length];
        const id = 'f' + Date.now() + '-' + (this.nextId++);
        const ext = pick[0].split('.').pop();
        if (this.state.files.length >= 10) { this.setState({ files: [...this.state.files, { id, name: pick[0], size: pick[1], pct: 0, status: 'error', error: 'Limit reached: up to 10 files per report.' }] }); return; }
        if (!OK_EXT.includes(ext)) { this.setState({ files: [...this.state.files, { id, name: pick[0], size: pick[1], pct: 0, status: 'error', error: 'File type .' + ext + ' isn’t allowed.' }] }); return; }
        this.setState({ files: [...this.state.files, { id, name: pick[0], size: pick[1], pct: 0, status: 'uploading', retryable: true }] }, () => this.startUpload(id));
      },
      addFilesUnused: (ev) => {
        const list = Array.from(ev.target.files || []);
        ev.target.value = '';
        const added = [];
        list.forEach((file) => {
          const id = 'f' + Date.now() + '-' + (this.nextId++);
          const ext = (file.name.split('.').pop() || '').toLowerCase();
          if (this.state.files.length + added.length >= 10) { added.push({ id, name: file.name, size: file.size, pct: 0, status: 'error', error: 'Limit reached: up to 10 files per report.' }); return; }
          if (!OK_EXT.includes(ext)) { added.push({ id, name: file.name, size: file.size, pct: 0, status: 'error', error: 'File type .' + ext + ' isn’t allowed.' }); return; }
          if (file.size > 25 * 1048576) { added.push({ id, name: file.name, size: file.size, pct: 0, status: 'error', error: 'File is larger than 25 MB.' }); return; }
          added.push({ id, name: file.name, size: file.size, pct: 0, status: 'uploading', retryable: true });
        });
        this.setState({ files: [...this.state.files, ...added] }, () => added.filter((f) => f.status === 'uploading').forEach((f) => this.startUpload(f.id)));
      },
      uploadsPending,
      busy: s.busy, busyStr: s.busy ? 'true' : 'false', serverErr: s.serverErr,
      submitDisabled: s.busy || uploadsPending,
      submitLabel: s.busy ? 'Submitting…' : 'Submit report',
      submit: (ev) => {
        ev.preventDefault();
        if (s.busy || uploadsPending) return;
        if (errList.length) { this.setState({ tried: true }); return; }
        this.setState({ busy: true, tried: true, serverErr: false });
        clearTimeout(this.t);
        this.t = setTimeout(() => {
          if (this.props.failSubmit) this.setState({ busy: false, serverErr: true });
          else { WH.newReport = { title: this.state.title.trim(), program: ({ qamar: 'Qamar Retail', najm: 'Najm Clinics', sahel: 'Sahel Freight', mirqab: 'Mirqab Telecom' })[this.state.program] || 'Qamar Retail', sev: this.state.severity }; this.setState({ busy: false, done: true }); }
        }, 1300);
      }
    };
  }
}

Component.screen = "SubmitReport";
return Component;
})();
window.__whBoot();
</script>
